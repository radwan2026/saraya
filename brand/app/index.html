<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محفظة سداد ليبيا</title>
<meta name="description" content="معاينة تفاعلية لتطبيق محفظة سداد ليبيا الإلكترونية: التحويل، الاستلام، الدفع بالـ QR، الفواتير، شحن الرصيد، الإيداع والسحب.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Dinar One";src:url(../assets/fonts/GE-Dinar-One-Medium.otf) format("opentype");font-weight:100 599;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+00AB,U+00BB,U+200C-200F}
@font-face{font-family:"Dinar One";src:url(../assets/fonts/DinarOne-Bold.otf) format("opentype");font-weight:600 900;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+00AB,U+00BB,U+200C-200F}
:root{
  --green:#80B95A; --signal:#5DC23B; --forest:#1F3319; --charcoal:#535353;
  --mint:#E7F2DE; --paper:#F6F8F3; --ink:#1C1F1A; --muted:#6B7266; --line:#E3E8DD;
  --danger:#D8453B; --amber:#E9A23B;
  --font:"Dinar One","Open Sans",system-ui,sans-serif;
  --en:"Open Sans","Dinar One",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);color:var(--ink);background:var(--paper);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}

/* ---------- Presentation layout ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:56px;max-width:1240px;margin:0 auto;padding:40px 24px;align-items:start}
.panel{position:sticky;top:32px;display:flex;flex-direction:column;gap:20px}
.panel .brand{display:flex;align-items:center;justify-content:space-between;gap:16px}
.panel .brand img{height:52px}
.panel .brand a{font-size:14px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:6px 14px;border-radius:999px;background:#fff}
.panel h1{font-size:clamp(30px,3.4vw,44px);line-height:1.2;font-weight:700}
.panel h1 span{color:var(--green)}
.panel .lead{color:var(--muted);font-size:17px;line-height:1.8}
.now{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;position:relative;overflow:hidden}
.now::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--green)}
.now small{color:var(--green);font-weight:700;font-size:13px;letter-spacing:.04em}
.now h2{font-size:22px;margin:6px 0 8px}
.now p{color:var(--muted);line-height:1.8;font-size:15px}
.now ul{margin-top:10px;padding-inline-start:18px;color:var(--charcoal);font-size:14px;line-height:1.9}
.feat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.feat button{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:start;font-size:15px;font-weight:500;transition:.2s}
.feat button:hover{border-color:var(--green);background:var(--mint)}
.feat button .ic{width:22px;height:22px;stroke:var(--green);flex:none}
.demo-note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.demo-note b{font-family:var(--en);background:#fff;border:1px solid var(--line);padding:3px 10px;border-radius:8px;color:var(--ink)}
.demo-note button{margin-inline-start:auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px}
@media (max-width:980px){.stage{grid-template-columns:1fr;gap:32px}.panel{position:static;order:2}.device-wrap{order:1}}

/* ---------- Device ---------- */
.device-wrap{display:flex;justify-content:center}
.device{width:390px;height:844px;border-radius:58px;border:12px solid #17191c;background:#fff;position:relative;overflow:hidden;box-shadow:0 40px 80px rgba(31,51,25,.18),0 0 0 2px #2a2d31}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:#17191c;border-radius:20px;z-index:40;pointer-events:none}
@media (max-width:460px){
  .stage{padding:0 0 32px}
  .device{width:100vw;height:100svh;border:0;border-radius:0;box-shadow:none}
  .island{display:none}
  .panel{padding:0 16px}
}
#screen{position:absolute;inset:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.scr.in-1{animation:inR .32s cubic-bezier(.2,.8,.2,1)}
.scr.in--1{animation:inL .32s cubic-bezier(.2,.8,.2,1)}
.scr.in-0{animation:fade .35s ease}
@keyframes inR{from{transform:translateX(-24%);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(24%);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.scr{animation:none!important}}
.status{height:50px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:8px 30px 0;font:700 15px var(--en);direction:ltr}
.status .sig{display:flex;gap:6px;align-items:center}
.status svg{height:12px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 24px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.appbar{flex:none;display:flex;align-items:center;gap:10px;padding:6px 16px 12px}
.appbar h3{font-size:19px;font-weight:700;flex:1}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--paper);flex:none;position:relative}
.iconbtn .ic{width:22px;height:22px}
.dot-badge{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--danger);border:2px solid #fff}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Common UI ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:16px;background:var(--green);color:var(--forest);font-weight:700;font-size:17px;transition:.15s}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--line);color:#9aa293;cursor:not-allowed}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.foot{flex:none;padding:12px 20px 26px;display:grid;gap:10px;background:#fff}
.label{font-size:14px;color:var(--muted);margin:18px 0 8px;display:block}
.field{display:flex;align-items:center;gap:10px;height:56px;border:1.5px solid var(--line);border-radius:16px;padding:0 16px;background:#fff}
.field:focus-within{border-color:var(--green)}
.field input{flex:1;border:0;outline:0;background:none;font-size:17px;min-width:0}
.field .pre{font-family:var(--en);color:var(--muted);font-weight:600;direction:ltr}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec-t{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}
.sec-t h4{font-size:17px}
.sec-t button{color:var(--green);font-size:14px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:500;background:#fff}
.chip.on{background:var(--forest);border-color:var(--forest);color:#fff}
.muted{color:var(--muted)}
.toast{position:absolute;top:58px;left:16px;right:16px;z-index:60;background:#fff;border:1px solid var(--line);box-shadow:0 14px 34px rgba(31,51,25,.18);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;transform:translateY(calc(-100% - 80px));opacity:0;visibility:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s,visibility .4s}
.toast.show{transform:none;opacity:1;visibility:visible}
.toast .tico{width:40px;height:40px;border-radius:12px;background:var(--mint);display:grid;place-items:center;flex:none;color:var(--forest)}
.toast b{display:block;font-size:15px}
.toast span{font-size:13px;color:var(--muted)}

/* ---------- Splash / onboarding / auth ---------- */
.splash{flex:1;display:grid;place-items:center;position:relative;overflow:hidden}
.splash img{width:230px;animation:pop .8s cubic-bezier(.2,.8,.2,1)}
.splash .sh{position:absolute;inset:0;width:100%;height:100%}
.splash .ver{position:absolute;bottom:40px;width:100%;text-align:center;color:var(--muted);font-size:13px}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.ob{flex:1;display:flex;flex-direction:column;padding:10px 28px 0}
.ob .skip{align-self:flex-end;color:var(--muted);font-size:15px;padding:6px 0}
.ob .art{flex:1;display:grid;place-items:center}
.ob .art .circle{width:250px;height:250px;border-radius:50%;background:var(--mint);display:grid;place-items:center;position:relative}
.ob .art .circle .ic{width:96px;height:96px;stroke:var(--forest);stroke-width:1.4}
.ob .art .circle::after{content:"";position:absolute;inset:-18px;border-radius:50%;border:2px dashed rgba(128,185,90,.5)}
.ob h2{font-size:28px;line-height:1.35;margin-top:12px}
.ob p{color:var(--muted);line-height:1.8;margin-top:10px;font-size:16px}
.dots{display:flex;gap:6px;margin:24px 0}
.dots i{width:8px;height:8px;border-radius:8px;background:var(--line);transition:.3s}
.dots i.on{width:26px;background:var(--green)}
.auth{flex:1;padding:8px 24px;display:flex;flex-direction:column}
.auth img{width:150px;margin:8px 0 28px}
.auth h2{font-size:26px}
.auth p{color:var(--muted);margin-top:8px;line-height:1.7}
.otp{display:flex;gap:10px;justify-content:center;direction:ltr;margin:28px 0 16px}
.otp span{width:46px;height:58px;border-radius:14px;border:1.5px solid var(--line);display:grid;place-items:center;font:700 24px var(--en);transition:.2s}
.otp span.f{border-color:var(--green);background:var(--mint)}
.resend{text-align:center;color:var(--muted);font-size:14px}
.resend b{color:var(--green)}

/* ---------- Home ---------- */
.hello{display:flex;align-items:center;gap:12px;padding:4px 20px 14px;flex:none}
.avatar{width:46px;height:46px;border-radius:15px;background:var(--mint);display:grid;place-items:center;font-weight:700;color:var(--forest);font-size:18px;flex:none}
.hello div{flex:1}
.hello small{color:var(--muted);font-size:13px}
.hello b{display:block;font-size:18px}
.balance{border-radius:26px;padding:20px;background:linear-gradient(135deg,#8CC765 0%,#5DC23B 100%);color:var(--forest);position:relative;overflow:hidden}
.balance svg.bgs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.balance .top{display:flex;justify-content:space-between;align-items:center;position:relative}
.balance .top span{font-size:14px;font-weight:500}
.balance .eye{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.35);display:grid;place-items:center}
.balance .eye .ic{width:20px;height:20px}
.balance .amt{font:800 34px var(--en);margin:6px 0 2px;direction:ltr;text-align:right;position:relative;letter-spacing:-.5px}
.balance .amt small{font:700 16px var(--font);margin-left:6px}
.balance .wid{font-size:13px;opacity:.85;position:relative}
.balance .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;position:relative}
.balance .acts button{height:44px;border-radius:14px;background:#fff;color:var(--forest);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.balance .acts button .ic{width:20px;height:20px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;margin-top:22px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500;text-align:center;line-height:1.3}
.quick .qi{width:56px;height:56px;border-radius:18px;background:var(--paper);display:grid;place-items:center;color:var(--forest);transition:.2s}
.quick button:hover .qi{background:var(--mint)}
.quick .qi .ic{width:26px;height:26px}
.quick button:first-child .qi{background:var(--green)}
.ad{margin-top:22px;border-radius:22px;overflow:hidden;position:relative;height:150px;display:block;width:100%;text-align:start}
.ad img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 40%}
.ad::before{content:"";position:absolute;inset:0;background:linear-gradient(270deg,#fff 0%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 80%);z-index:1}
.ad .t{position:relative;z-index:2;padding:18px;max-width:58%;display:block}
.ad .t small{display:inline-block;background:var(--mint);color:var(--forest);font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px}
.ad .t b{display:block;font-size:18px;line-height:1.35;margin:8px 0 10px}
.ad .t span{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--forest);background:var(--green);padding:6px 12px;border-radius:999px}
.ad .adtag{position:absolute;z-index:2;top:10px;left:12px;font-size:10px;color:#fff;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:6px}
.ad-dots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.ad-dots i{width:6px;height:6px;border-radius:6px;background:var(--line)}
.ad-dots i.on{width:18px;background:var(--green)}

/* transactions */
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.tx:last-child{border-bottom:0}
.tx .ti{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;background:var(--paper);color:var(--forest)}
.tx .ti.in{background:var(--mint)}
.tx .ti .ic{width:22px;height:22px}
.tx .tm{flex:1;min-width:0}
.tx .tm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .tm small{color:var(--muted);font-size:12.5px}
.tx .ta{font:700 15px var(--en);direction:ltr;white-space:nowrap}
.tx .ta.pos{color:#3E8E1F}
.tx .ta small{display:block;font:500 11px var(--font);color:var(--muted);text-align:left}
.empty{text-align:center;color:var(--muted);padding:40px 0}

/* tab bar */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 8px 24px;border-top:1px solid var(--line);background:#fff}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:#9aa293;font-weight:500}
.tabbar button.on{color:var(--forest)}
.tabbar button.on .ic{stroke:var(--green)}
.tabbar .fab{width:60px;height:60px;border-radius:20px;background:var(--green);color:var(--forest);display:grid;place-items:center;margin-top:-30px;box-shadow:0 10px 24px rgba(93,194,59,.45);justify-self:center}
.tabbar .fab .ic{width:28px;height:28px;stroke:var(--forest)!important}

/* ---------- Flows ---------- */
.contacts{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
.contact{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:64px;font-size:12.5px;text-align:center;line-height:1.3}
.contact .avatar{width:56px;height:56px;border-radius:50%}
.list-item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:18px;width:100%;text-align:start;margin-bottom:10px;background:#fff;transition:.2s}
.list-item:hover{border-color:var(--green)}
.list-item .li{width:46px;height:46px;border-radius:14px;background:var(--mint);display:grid;place-items:center;color:var(--forest);flex:none}
.list-item .li .ic{width:24px;height:24px}
.list-item div{flex:1}
.list-item b{display:block;font-size:16px}
.list-item small{color:var(--muted);font-size:13px}
.list-item .chev{width:20px;height:20px;color:#a8b0a1}
.list-item.sel{border-color:var(--green);background:var(--mint)}

.amount-view{text-align:center;padding:20px 0 6px}
.amount-view .to{display:inline-flex;align-items:center;gap:8px;background:var(--paper);padding:6px 14px 6px 6px;border-radius:999px;font-size:14px}
.amount-view .to .avatar{width:30px;height:30px;border-radius:50%;font-size:13px}
.amount-view .big{font:800 46px var(--en);direction:ltr;margin-top:22px;letter-spacing:-1px;min-height:62px}
.amount-view .big small{font:700 20px var(--font);color:var(--muted);margin-left:8px}
.amount-view .bal{color:var(--muted);font-size:14px;margin-top:4px}
.amount-view .bal.err{color:var(--danger)}
.preset{display:flex;gap:8px;justify-content:center;margin:14px 0 4px}
.preset button{border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font:600 14px var(--en)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;direction:ltr;padding:0 6px}
.keypad button{height:58px;border-radius:16px;font:600 26px var(--en);transition:.1s}
.keypad button:active{background:var(--paper)}
.keypad button .ic{width:26px;height:26px}

.review{border:1px solid var(--line);border-radius:22px;overflow:hidden}
.review .hd{background:var(--paper);padding:22px;text-align:center}
.review .hd small{color:var(--muted)}
.review .hd b{display:block;font:800 34px var(--en);direction:ltr;margin-top:4px}
.review .hd b small{font:700 16px var(--font);color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:13px 18px;border-top:1px solid var(--line);font-size:15px}
.kv span{color:var(--muted)}
.kv b{text-align:left;font-weight:700}
.note{margin-top:14px}

/* PIN sheet */
.sheet-bg{position:absolute;inset:0;background:rgba(20,24,18,.45);z-index:50;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:#fff;width:100%;border-radius:30px 30px 0 0;padding:12px 20px 26px;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 16px}
.sheet h4{text-align:center;font-size:19px}
.sheet p{text-align:center;color:var(--muted);font-size:14px;margin-top:4px}
.pins{display:flex;justify-content:center;gap:16px;margin:22px 0;direction:ltr}
.pins i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);transition:.15s}
.pins i.f{background:var(--green);border-color:var(--green)}
.pins.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.bio{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--green);font-weight:700;font-size:15px;margin:-6px auto 10px}

/* processing + success */
.proc{flex:1;display:grid;place-items:center;text-align:center}
.spinner{width:72px;height:72px;border-radius:50%;border:6px solid var(--mint);border-top-color:var(--green);animation:spin 1s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.success{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 24px 0;text-align:center;overflow-y:auto}
.okc{width:104px;height:104px;border-radius:50%;background:var(--green);display:grid;place-items:center;box-shadow:0 0 0 16px var(--mint);margin:26px 0 30px;animation:pop .5s cubic-bezier(.2,.8,.2,1)}
.okc .ic{width:52px;height:52px;stroke:#fff;stroke-width:3}
.success h2{font-size:24px}
.success .amtb{font:800 36px var(--en);direction:ltr;margin:8px 0 2px}
.success .amtb small{font:700 16px var(--font);color:var(--muted)}
.success .review{width:100%;margin-top:22px;text-align:start}
.code-box{margin:18px 0 6px;font:800 34px var(--en);letter-spacing:8px;background:var(--mint);color:var(--forest);padding:14px 20px;border-radius:18px;direction:ltr}

/* receive */
.qr-card{border:1px solid var(--line);border-radius:28px;padding:22px;text-align:center;margin-top:6px}
.qr-card .qrw{width:220px;height:220px;margin:16px auto;padding:12px;border-radius:20px;border:1.5px solid var(--line);position:relative}
.qr-card .qrw svg{width:100%;height:100%;display:block}
.qr-card .qrw .mid{position:absolute;inset:0;margin:auto;width:52px;height:52px;background:#fff;border-radius:12px;display:grid;place-items:center}
.qr-card .qrw .mid svg{width:34px;height:36px}
.copy{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border-radius:12px;padding:8px 14px;font:700 15px var(--en)}
.copy .ic{width:18px;height:18px}

/* scan */

  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16))continue;
    if(x>9&&x<15&&y>9&&y<15)continue;

function statusBar(light){
  const t=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  return `<div class="status ${light?'light':''}"><span>${t}</span><span class="sig">
  <svg viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
  <svg viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 4.5a10 10 0 0114 0M3.5 7.5a6.5 6.5 0 019 0"/><circle cx="8" cy="10.5" r="1" fill="currentColor"/></svg>
  <svg viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="16" height="8" rx="1.8" fill="currentColor"/><rect x="23.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg>
  </span></div>`;
}
const appbar=(t,extra='')=>`<div class="appbar"><button class="iconbtn" data-act="back" aria-label="رجوع">${ic('back')}</button><h3>${t}</h3>${extra}</div>`;
const tabbar=a=>`<nav class="tabbar">
  <button class="${a==='home'?'on':''}" data-reset="home">${ic('home')}الرئيسية</button>
  <button class="${a==='history'?'on':''}" data-reset="history">${ic('list')}المعاملات</button>
  <button class="fab" data-go="scan" aria-label="مسح QR">${ic('scan')}</button>
  <button class="${a==='cards'?'on':''}" data-reset="cards">${ic('card')}البطاقة</button>
  <button class="${a==='profile'?'on':''}" data-reset="profile">${ic('user')}حسابي</button></nav>`;
const txRow=(t,i)=>`<button class="tx" data-tx="${i}"><span class="ti ${t.amount>0?'in':''}">${ic(TXI[t.type])}</span>
  <span class="tm"><b>${t.title}</b><small>${fdate(t.date)}</small></span>
  <span class="ta ${t.amount>0?'pos':''}">${t.amount>0?'+':'−'}${fmt(t.amount)}<small>د.ل</small></span></button>`;
const keypad=()=>`<div class="keypad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button data-key="${k}">${k}</button>`).join('')}<button data-key=".">.</button><button data-key="0">0</button><button data-key="del" aria-label="حذف">${ic('del')}</button></div>`;
const shardsBg=(o=.18)=>`<svg class="bgs" viewBox="0 0 350 220" preserveAspectRatio="xMidYMid slice"><g fill="#fff"><polygon points="0,220 0,120 100,220" opacity="${o+.1}"/><polygon points="40,-10 110,60 110,220 40,150" opacity="${o}"/><polygon points="110,60 170,0 170,120 110,180" opacity="${o*.7}"/></g></svg>`;

/* =========================================================
   Router
   ========================================================= */
const scr=document.getElementById('screen');
function render(dir=0){
  const n=stack[stack.length-1];
  const body=V[n]();
  scr.innerHTML=`<div class="scr in-${dir}">${n==='scan'?'':statusBar()}${body}</div>`;
  const [t,d,l]=INFO[n]||['',''];
  document.getElementById('now-t').textContent=t;
  document.getElementById('now-d').textContent=d;
  document.getElementById('now-l').innerHTML=(l||[]).map(x=>`<li>${x}</li>`).join('');
  (HOOK[n]||(()=>{}))();
}
function go(n){stack.push(n);render(1)}
function back(){clearTimeout(T);if(stack.length>1){stack.pop();render(-1)}}
function reset(n){clearTimeout(T);stack=[n];render(0)}
let T;
const HOOK={
  splash:()=>{T=setTimeout(()=>{stack=['onboard'];render(0)},1700)},
  otp:()=>{const boxes=[...document.querySelectorAll('#otp span')];let i=0;
    const step=()=>{if(stack.at(-1)!=='otp')return;if(i<6){boxes[i].textContent='123456'[i];boxes[i].classList.add('f');i++;T=setTimeout(step,170)}else document.getElementById('otpBtn').disabled=false};
    T=setTimeout(step,700)},
  scan:()=>{T=setTimeout(()=>{if(stack.at(-1)==='scan'){document.getElementById('scanHint').textContent='تم التعرّف على الرمز ✓';T=setTimeout(scanFound,500)}},2000)},
  processing:()=>{T=setTimeout(()=>{stack.pop();stack.pop();stack.push('success');render(1)},1300)},
  sendAmount:updAmt,merchantAmount:updAmt,requestAmount:updAmt,topupAmount:updAmt,withdraw:updAmt
};
function scanFound(){F.merchant='مقهى المدينة';F.amt='';stack.pop();go('merchantAmount')}

   ========================================================= */
function askPin(cb,title='أدخل الرمز السري',sub='لتأكيد العملية'){
  let pin='';const dev=document.getElementById('device');
  const bg=document.createElement('div');bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet"><div class="grab"></div><h4>${title}</h4><p>${sub}</p>
   <div class="pins" id="pins">${'<i></i>'.repeat(4)}</div>
   ${S.bio?`<button class="bio" data-pin-bio>${ic('finger')}استخدم البصمة</button>`:''}${keypad()}</div>`;
  dev.appendChild(bg);
  const dots=()=>bg.querySelectorAll('.pins i').forEach((d,i)=>d.classList.toggle('f',i<pin.length));
  const done=()=>{bg.remove();cb()};
  bg.addEventListener('click',e=>{
    if(e.target===bg){bg.remove();return}
    if(e.target.closest('[data-pin-bio]')){bg.querySelector('.bio').textContent='جاري التحقق…';setTimeout(done,700);return}
    const k=e.target.closest('[data-key]');if(!k)return;e.stopPropagation();
    const v=k.dataset.key;
    if(v==='del')pin=pin.slice(0,-1);else if(v!=='.'&&pin.length<4)pin+=v;
    dots();
    if(pin.length===4){
      if(pin==='1234')setTimeout(done,150);
      else{const p=bg.querySelector('.pins');p.classList.add('shake');bg.querySelector('p').textContent='رمز غير صحيح — جرّب 1234';setTimeout(()=>{p.classList.remove('shake');pin='';dots()},450)}
    }
  });
}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-go],[data-reset],[data-key],[data-preset],[data-contact],[data-tx],[data-biller],[data-op],[data-ramt],[data-method],[data-filter],[data-demo]');
  if(!el||el.closest('.sheet-bg'))return;
  const d=el.dataset;
  if(d.demo){S.logged=true;clearTimeout(T);F={};
    const tabs=['history','cards','profile'];stack=tabs.includes(d.demo)?[d.demo]:['home',d.demo];
    if(window.innerWidth<=980)document.getElementById('device').scrollIntoView({behavior:'smooth'});
    render(1);return}
  if(d.act)return ACT[d.act]();
  if(d.go){if(['sendAmount','requestAmount','withdraw','merchantAmount'].includes(d.go)||d.go==='withdraw')F.amt='';if(d.go==='bills'){F.due=null;F.acc=''}if(d.go==='recharge'){F.rAmt=10;F.rph=''}return go(d.go)}
  if(d.reset){F.filter=d.reset==='history'?'all':F.filter;return reset(d.reset)}
  if(d.key){let a=F.amt||'';const k=d.key;
    if(k==='del')a=a.slice(0,-1);
    else if(k==='.'){if(!a.includes('.'))a=(a||'0')+'.'}
    else{if(a.includes('.')&&a.split('.')[1].length>=3)return;if(a==='0')a='';if(a.replace('.','').length>=7)return;a+=k}
    F.amt=a;return updAmt()}
  if(d.preset){F.amt=d.preset;return updAmt()}
  if(d.contact!=null){F.to=CONTACTS[+d.contact];F.amt='';return go('sendAmount')}
  if(d.tx!=null){F.txi=+d.tx;return go('txdetail')}
  if(d.biller!=null){F.biller=BILLERS[+d.biller];F.acc=d.saved?'1002 4478 3310':'';F.due=null;return go('billAccount')}
  if(d.op){F.rph=(document.getElementById('rph')||{}).value||F.rph;F.op=d.op;return render(0)}
  if(d.ramt){F.rph=(document.getElementById('rph')||{}).value||F.rph;F.rAmt=+d.ramt;return render(0)}
  if(d.method){F.method=d.method;F.methodName=d.method==='card'?'بطاقة مصرفية':'حساب مصرفي';F.amt='';return go('topupAmount')}
  if(d.filter){F.filter=d.filter;return render(0)}
});
setInterval(()=>{const s=document.querySelector('.status span');if(s)s.textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})},30000);
render(0);
</script>
</body>
