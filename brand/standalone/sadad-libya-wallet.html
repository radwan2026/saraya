:root{
  --green:#80B95A; --signal:#5DC23B; --forest:#1F3319; --charcoal:#535353;
  --mint:#E7F2DE; --paper:#F6F8F3; --ink:#1C1F1A; --muted:#6B7266; --line:#E3E8DD;
  --danger:#D8453B; --amber:#E9A23B;
  --font:"Open Sans","Dinar One",system-ui,sans-serif;
  --en:"Open Sans","Dinar One",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);color:var(--ink);background:var(--paper);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}

/* ---------- Presentation layout ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:56px;max-width:1240px;margin:0 auto;padding:40px 24px;align-items:start}
.panel{position:sticky;top:32px;display:flex;flex-direction:column;gap:20px}
.panel .brand{display:flex;align-items:center;justify-content:space-between;gap:16px}
.panel .brand img{height:52px}
.panel .brand a{font-size:14px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:6px 14px;border-radius:999px;background:#fff}
.panel h1{font-size:clamp(30px,3.4vw,44px);line-height:1.2;font-weight:700}
.panel h1 span{color:var(--green)}
.panel .lead{color:var(--muted);font-size:17px;line-height:1.8}
.now{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;position:relative;overflow:hidden}
.now::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--green)}
.now small{color:var(--green);font-weight:700;font-size:13px}
.now h2{font-size:22px;margin:6px 0 8px}
.now p{color:var(--muted);line-height:1.8;font-size:15px}
.now ul{margin-top:10px;padding-inline-start:18px;color:var(--charcoal);font-size:14px;line-height:1.9}
.feat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.feat button{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:start;font-size:15px;font-weight:500;transition:.2s}
.feat button:hover{border-color:var(--green);background:var(--mint)}
.feat button .ic{width:22px;height:22px;stroke:var(--green);flex:none}
.demo-note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.demo-note b{font-family:var(--en);background:#fff;border:1px solid var(--line);padding:3px 10px;border-radius:8px;color:var(--ink)}
.demo-note button{margin-inline-start:auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px}
@media (max-width:980px){.stage{grid-template-columns:1fr;gap:32px}.panel{position:static;order:2}.device-wrap{order:1}}

/* ---------- Device ---------- */
.device-wrap{display:flex;justify-content:center}
.device{width:390px;height:844px;border-radius:58px;border:12px solid #17191c;background:#fff;position:relative;overflow:hidden;box-shadow:0 40px 80px rgba(31,51,25,.18),0 0 0 2px #2a2d31}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:#17191c;border-radius:20px;z-index:40;pointer-events:none}
@media (max-width:460px){
  .stage{padding:0 0 32px}
  .device{width:100vw;height:100svh;border:0;border-radius:0;box-shadow:none}
  .island{display:none}
  .panel{padding:0 16px}
}
#screen{position:absolute;inset:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.scr.in-1{animation:inR .32s cubic-bezier(.2,.8,.2,1)}
.scr.in--1{animation:inL .32s cubic-bezier(.2,.8,.2,1)}
.scr.in-0{animation:fade .35s ease}
@keyframes inR{from{transform:translateX(-24%);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(24%);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.scr{animation:none!important}}
.status{height:50px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:8px 30px 0;font:700 15px var(--en);direction:ltr}
.status .sig{display:flex;gap:6px;align-items:center}
.status svg{height:12px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 24px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.appbar{flex:none;display:flex;align-items:center;gap:10px;padding:6px 16px 12px}
.appbar h3{font-size:19px;font-weight:700;flex:1}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--paper);flex:none;position:relative}
.iconbtn .ic{width:22px;height:22px}
.dot-badge{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--danger);border:2px solid #fff}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Common UI ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:16px;background:var(--green);color:var(--forest);font-weight:700;font-size:17px;transition:.15s}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--line);color:#9aa293;cursor:not-allowed}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.foot{flex:none;padding:12px 20px 26px;display:grid;gap:10px;background:#fff}
.label{font-size:14px;color:var(--muted);margin:18px 0 8px;display:block}
.field{display:flex;align-items:center;gap:10px;height:56px;border:1.5px solid var(--line);border-radius:16px;padding:0 16px;background:#fff}
.field:focus-within{border-color:var(--green)}
.field input{flex:1;border:0;outline:0;background:none;font-size:17px;min-width:0}
.field .pre{font-family:var(--en);color:var(--muted);font-weight:600;direction:ltr}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec-t{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}
.sec-t h4{font-size:17px}
.sec-t button{color:var(--green);font-size:14px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:500;background:#fff}
.chip.on{background:var(--forest);border-color:var(--forest);color:#fff}
.muted{color:var(--muted)}
.toast{position:absolute;top:58px;left:16px;right:16px;z-index:60;background:#fff;border:1px solid var(--line);box-shadow:0 14px 34px rgba(31,51,25,.18);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;transform:translateY(calc(-100% - 80px));opacity:0;visibility:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s,visibility .4s}
.toast.show{transform:none;opacity:1;visibility:visible}
.toast .tico{width:40px;height:40px;border-radius:12px;background:var(--mint);display:grid;place-items:center;flex:none;color:var(--forest)}
.toast b{display:block;font-size:15px}
.toast span{font-size:13px;color:var(--muted)}

/* ---------- Splash / onboarding / auth ---------- */
.splash{flex:1;display:grid;place-items:center;position:relative;overflow:hidden}
.splash img{width:230px;animation:pop .8s cubic-bezier(.2,.8,.2,1)}
.splash .sh{position:absolute;inset:0;width:100%;height:100%}
.splash .ver{position:absolute;bottom:40px;width:100%;text-align:center;color:var(--muted);font-size:13px}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.ob{flex:1;display:flex;flex-direction:column;padding:10px 28px 0}
.ob .skip{align-self:flex-end;color:var(--muted);font-size:15px;padding:6px 0}
.ob .art{flex:1;display:grid;place-items:center}
.ob .art .circle{width:250px;height:250px;border-radius:50%;background:var(--mint);display:grid;place-items:center;position:relative}
.ob .art .circle .ic{width:96px;height:96px;stroke:var(--forest);stroke-width:1.4}
.ob .art .circle::after{content:"";position:absolute;inset:-18px;border-radius:50%;border:2px dashed rgba(128,185,90,.5)}
.ob h2{font-size:28px;line-height:1.35;margin-top:12px}
.ob p{color:var(--muted);line-height:1.8;margin-top:10px;font-size:16px}
.dots{display:flex;gap:6px;margin:24px 0}
.dots i{width:8px;height:8px;border-radius:8px;background:var(--line);transition:.3s}
.dots i.on{width:26px;background:var(--green)}
.auth{flex:1;padding:8px 24px;display:flex;flex-direction:column}
.auth img{width:150px;margin:8px 0 28px}
.auth h2{font-size:26px}
.auth p{color:var(--muted);margin-top:8px;line-height:1.7}
.otp{display:flex;gap:10px;justify-content:center;direction:ltr;margin:28px 0 16px}
.otp span{width:46px;height:58px;border-radius:14px;border:1.5px solid var(--line);display:grid;place-items:center;font:700 24px var(--en);transition:.2s}
.otp span.f{border-color:var(--green);background:var(--mint)}
.resend{text-align:center;color:var(--muted);font-size:14px}
.resend b{color:var(--green)}

/* ---------- Home ---------- */
.hello{display:flex;align-items:center;gap:12px;padding:4px 20px 14px;flex:none}
.avatar{width:46px;height:46px;border-radius:15px;background:var(--mint);display:grid;place-items:center;font-weight:700;color:var(--forest);font-size:18px;flex:none}
.hello div{flex:1}
.hello small{color:var(--muted);font-size:13px}
.hello b{display:block;font-size:18px}
.balance{border-radius:26px;padding:20px;background:linear-gradient(135deg,#8CC765 0%,#5DC23B 100%);color:var(--forest);position:relative;overflow:hidden}
.balance svg.bgs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.balance .top{display:flex;justify-content:space-between;align-items:center;position:relative}
.balance .top span{font-size:14px;font-weight:500}
.balance .eye{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.35);display:grid;place-items:center}
.balance .eye .ic{width:20px;height:20px}
.balance .amt{font:800 34px var(--en);margin:6px 0 2px;direction:ltr;text-align:right;position:relative;letter-spacing:-.5px}
.balance .amt small{letter-spacing:0;font:700 16px var(--font);margin-left:6px}
.balance .wid{font-size:13px;opacity:.85;position:relative}
.balance .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;position:relative}
.balance .acts button{height:44px;border-radius:14px;background:#fff;color:var(--forest);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.balance .acts button .ic{width:20px;height:20px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;margin-top:22px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500;text-align:center;line-height:1.3}
.quick .qi{width:56px;height:56px;border-radius:18px;background:var(--paper);display:grid;place-items:center;color:var(--forest);transition:.2s}
.quick button:hover .qi{background:var(--mint)}
.quick .qi .ic{width:26px;height:26px}
.quick button:first-child .qi{background:var(--green)}
.ad{margin-top:22px;border-radius:22px;overflow:hidden;position:relative;height:150px;display:block;width:100%;text-align:start}
.ad img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 40%}
.ad::before{content:"";position:absolute;inset:0;background:linear-gradient(270deg,#fff 0%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 80%);z-index:1}
.ad .t{position:relative;z-index:2;padding:18px;max-width:58%;display:block}
.ad .t small{display:inline-block;background:var(--mint);color:var(--forest);font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px}
.ad .t b{display:block;font-size:18px;line-height:1.35;margin:8px 0 10px}
.ad .t span{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--forest);background:var(--green);padding:6px 12px;border-radius:999px}
.ad .adtag{position:absolute;z-index:2;top:10px;left:12px;font-size:10px;color:#fff;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:6px}
.ad-dots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.ad-dots i{width:6px;height:6px;border-radius:6px;background:var(--line)}
.ad-dots i.on{width:18px;background:var(--green)}

/* transactions */
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.tx:last-child{border-bottom:0}
.tx .ti{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;background:var(--paper);color:var(--forest)}
.tx .ti.in{background:var(--mint)}
.tx .ti .ic{width:22px;height:22px}
.tx .tm{flex:1;min-width:0}
.tx .tm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .tm small{color:var(--muted);font-size:12.5px}
.tx .ta{font:700 15px var(--en);direction:ltr;white-space:nowrap}
.tx .ta.pos{color:#3E8E1F}
.tx .ta small{display:block;font:500 11px var(--font);color:var(--muted);text-align:left}
.empty{text-align:center;color:var(--muted);padding:40px 0}

/* tab bar */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 8px 24px;border-top:1px solid var(--line);background:#fff}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:#9aa293;font-weight:500}
.tabbar button.on{color:var(--forest)}
.tabbar button.on .ic{stroke:var(--green)}
.tabbar .fab{width:60px;height:60px;border-radius:20px;background:var(--green);color:var(--forest);display:grid;place-items:center;margin-top:-30px;box-shadow:0 10px 24px rgba(93,194,59,.45);justify-self:center}
.tabbar .fab .ic{width:28px;height:28px;stroke:var(--forest)!important}

/* ---------- Flows ---------- */
.contacts{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
.contact{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:64px;font-size:12.5px;text-align:center;line-height:1.3}
.contact .avatar{width:56px;height:56px;border-radius:50%}
.list-item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:18px;width:100%;text-align:start;margin-bottom:10px;background:#fff;transition:.2s}
.list-item:hover{border-color:var(--green)}
.list-item .li{width:46px;height:46px;border-radius:14px;background:var(--mint);display:grid;place-items:center;color:var(--forest);flex:none}
.list-item .li .ic{width:24px;height:24px}
.list-item div{flex:1}
.list-item b{display:block;font-size:16px}
.list-item small{color:var(--muted);font-size:13px}
.list-item .chev{width:20px;height:20px;color:#a8b0a1}
.list-item.sel{border-color:var(--green);background:var(--mint)}

.amount-view{text-align:center;padding:20px 0 6px}
.amount-view .to{display:inline-flex;align-items:center;gap:8px;background:var(--paper);padding:6px 14px 6px 6px;border-radius:999px;font-size:14px}
.amount-view .to .avatar{width:30px;height:30px;border-radius:50%;font-size:13px}
.amount-view .big{font:800 46px var(--en);direction:ltr;margin-top:22px;letter-spacing:-1px;min-height:62px}
.amount-view .big small{letter-spacing:0;font:700 20px var(--font);color:var(--muted);margin-left:8px}
.amount-view .bal{color:var(--muted);font-size:14px;margin-top:4px}
.amount-view .bal.err{color:var(--danger)}
.preset{display:flex;gap:8px;justify-content:center;margin:14px 0 4px}
.preset button{border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font:600 14px var(--en)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;direction:ltr;padding:0 6px}
.keypad button{height:58px;border-radius:16px;font:600 26px var(--en);transition:.1s}
.keypad button:active{background:var(--paper)}
.keypad button .ic{width:26px;height:26px}

.review{border:1px solid var(--line);border-radius:22px;overflow:hidden}
.review .hd{background:var(--paper);padding:22px;text-align:center}
.review .hd small{color:var(--muted)}
.review .hd b{display:block;font:800 34px var(--en);direction:ltr;margin-top:4px}
.review .hd b small{font:700 16px var(--font);color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:13px 18px;border-top:1px solid var(--line);font-size:15px}
.kv span{color:var(--muted)}
.kv b{text-align:left;font-weight:700}
.note{margin-top:14px}

/* PIN sheet */
.sheet-bg{position:absolute;inset:0;background:rgba(20,24,18,.45);z-index:50;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:#fff;width:100%;border-radius:30px 30px 0 0;padding:12px 20px 26px;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 16px}
.sheet h4{text-align:center;font-size:19px}
.sheet p{text-align:center;color:var(--muted);font-size:14px;margin-top:4px}
.pins{display:flex;justify-content:center;gap:16px;margin:22px 0;direction:ltr}
.pins i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);transition:.15s}
.pins i.f{background:var(--green);border-color:var(--green)}
.pins.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.bio{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--green);font-weight:700;font-size:15px;margin:-6px auto 10px}

/* processing + success */
.proc{flex:1;display:grid;place-items:center;text-align:center}
.spinner{width:72px;height:72px;border-radius:50%;border:6px solid var(--mint);border-top-color:var(--green);animation:spin 1s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.success{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 24px 0;text-align:center;overflow-y:auto}
.okc{width:104px;height:104px;border-radius:50%;background:var(--green);display:grid;place-items:center;box-shadow:0 0 0 16px var(--mint);margin:26px 0 30px;animation:pop .5s cubic-bezier(.2,.8,.2,1)}
.okc .ic{width:52px;height:52px;stroke:#fff;stroke-width:3}
.success h2{font-size:24px}
.success .amtb{font:800 36px var(--en);direction:ltr;margin:8px 0 2px}
.success .amtb small{font:700 16px var(--font);color:var(--muted)}
.success .review{width:100%;margin-top:22px;text-align:start}
.code-box{margin:18px 0 6px;font:800 34px var(--en);letter-spacing:8px;background:var(--mint);color:var(--forest);padding:14px 20px;border-radius:18px;direction:ltr}

/* receive */
.qr-card{border:1px solid var(--line);border-radius:28px;padding:22px;text-align:center;margin-top:6px}
.qr-card .qrw{width:220px;height:220px;margin:16px auto;padding:12px;border-radius:20px;border:1.5px solid var(--line);position:relative}
.qr-card .qrw svg{width:100%;height:100%;display:block}
.qr-card .qrw .mid{position:absolute;inset:0;margin:auto;width:52px;height:52px;background:#fff;border-radius:12px;display:grid;place-items:center}
.qr-card .qrw .mid svg{width:34px;height:36px}
.copy{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border-radius:12px;padding:8px 14px;font:700 15px var(--en)}
.copy .ic{width:18px;height:18px}

.camera .frame{width:240px;height:240px;position:relative;z-index:2}
.camera .frame i{position:absolute;width:44px;height:44px;border:5px solid var(--green)}
.camera .frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:18px 0 0 0}
.camera .frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 18px 0 0}
.camera .frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 18px}
.camera .frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 18px 0}
.camera .frame .line{position:absolute;left:10px;right:10px;height:3px;background:var(--green);box-shadow:0 0 14px var(--green);animation:scan 1.6s ease-in-out infinite alternate;border-radius:3px}
@keyframes scan{from{top:12px}to{top:224px}}
.camera .frame .qrfake{position:absolute;inset:34px;opacity:.9}
.camera .hint{position:absolute;z-index:2;bottom:120px;color:#fff;text-align:center;width:100%;font-size:15px}
.camera .top{position:absolute;z-index:3;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:8px 16px}
.camera .top .iconbtn{background:rgba(255,255,255,.18);color:#fff}
.camera .top b{color:#fff}
.camera .bottom{position:absolute;z-index:3;bottom:26px;left:20px;right:20px;display:flex;gap:10px}
.camera .bottom button{flex:1;height:50px;border-radius:16px;background:rgba(255,255,255,.16);color:#fff;font-weight:700;backdrop-filter:blur(8px)}
.status.light{color:#fff;position:absolute;z-index:3;left:0;right:0;top:0}

/* profile */
.pro-head{text-align:center;padding:6px 0 18px}
.pro-head .avatar{width:84px;height:84px;border-radius:28px;font-size:32px;margin:0 auto 12px}
.pro-head h3{font-size:22px}
.pro-head small{font:600 14px var(--en);color:var(--muted)}
.kyc{background:var(--mint);border-radius:20px;padding:16px;margin-bottom:16px}
.kyc .bar{height:8px;border-radius:8px;background:#fff;margin:10px 0 6px;overflow:hidden}
.kyc .bar i{display:block;height:100%;width:66%;background:var(--green);border-radius:8px}
.kyc small{color:var(--charcoal);font-size:13px}
.menu{border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:16px}
.menu button,.menu .mi{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;border-bottom:1px solid var(--line);text-align:start;font-size:15.5px;font-weight:500}
.menu>*:last-child{border-bottom:0}
.menu .ic{width:22px;height:22px;color:var(--forest)}
.menu span{flex:1}
.menu .chev{width:18px;height:18px;color:#a8b0a1}
.menu .danger,.menu .danger .ic{color:var(--danger)}
.menu .switch,.switch{width:50px;height:30px;padding:0;border:0;border-radius:30px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.2s}
.switch.on{background:var(--green)}
.switch.on::after{right:23px}
.limits{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.limits div{background:var(--paper);border-radius:16px;padding:14px}
.limits small{color:var(--muted);font-size:12.5px}
.limits b{display:block;font:700 17px var(--en);direction:ltr;text-align:right;margin-top:2px}

/* virtual card */
.vcard{height:200px;border-radius:24px;padding:22px;position:relative;overflow:hidden;background:linear-gradient(135deg,#8CC765,#5DC23B);color:var(--forest);transition:.3s}
.vcard.frozen{filter:grayscale(1) opacity(.6)}
.vcard svg.bgs{position:absolute;inset:0;width:100%;height:100%}
.vcard img{height:34px;position:relative}
.vcard .num{font:700 20px var(--en);letter-spacing:2px;direction:ltr;text-align:left;position:absolute;bottom:58px;left:22px}
.vcard .meta{position:absolute;bottom:20px;left:22px;right:22px;display:flex;justify-content:space-between;font:600 13px var(--en);direction:ltr}
.vcard .chipc{position:absolute;top:24px;left:22px;width:42px;height:32px;border-radius:7px;background:linear-gradient(135deg,#f3e2a5,#cfae5a)}
.vcard .frz{position:absolute;inset:0;display:none;place-items:center;font-weight:700;font-size:18px;color:var(--ink)}
.vcard.frozen .frz{display:grid}

/* notifications */
.notif{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.notif .ti{width:42px;height:42px;border-radius:14px;background:var(--mint);display:grid;place-items:center;flex:none;color:var(--forest)}
.notif .ti .ic{width:20px;height:20px}
.notif b{font-size:15px;display:block}
.notif p{font-size:13.5px;color:var(--muted);line-height:1.6}
.notif small{font-size:12px;color:#9aa293}
.bill-due{background:var(--paper);border-radius:20px;padding:18px;margin-top:16px}
.bill-due .row+.row{margin-top:10px}
.bill-due .tot{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.bill-due .tot b{font:800 22px var(--en);direction:ltr}
.agents .list-item .li{background:var(--paper)}
.op-logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#fff}
</style>
</head>

/* fake (non-scannable) QR pattern */
function qrSVG(seed=7,fill='#1C1F1A'){
  const n=25;let s=seed,r='';const R=()=>(s=(s*9301+49297)%233280)/233280;
  const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" rx="1.6" fill="${fill}"/><rect x="${x+1}" y="${y+1}" width="5" height="5" rx="1" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" rx=".6" fill="${fill}"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16))continue;
    if(x>9&&x<15&&y>9&&y<15)continue;
    if(R()>.52)r+=`<rect x="${x}" y="${y}" width="1" height="1" rx=".25" fill="${fill}"/>`;
  }
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="geometricPrecision">${finder(0,0)}${finder(18,0)}${finder(0,18)}${r}</svg>`;
}

onboard:()=>{
  const sl=[['send','حوّل الأموال في ثوانٍ','أرسل واستلم المال من أي محفظة سداد ليبيا فوراً ومجاناً، برقم الهاتف فقط.'],
            ['scan','ادفع بالـ QR في كل مكان','امسح رمز التاجر وادفع بلمسة واحدة، في المتاجر والمقاهي والمطاعم.'],
            ['shield','آمنة وتحت سيطرتك','رمز سري وبصمة لكل عملية، وإشعار فوري بكل حركة على محفظتك.']][obIndex];
  return `<div class="ob"><button class="skip" data-act="toLogin">تخطي</button>
   <div class="art"><div class="circle">${ic(sl[0])}</div></div>
   <h2>${sl[1]}</h2><p>${sl[2]}</p>
   <div class="dots">${[0,1,2].map(i=>`<i class="${i===obIndex?'on':''}"></i>`).join('')}</div></div>
   <div class="foot"><button class="btn" data-act="obNext">${obIndex<2?'التالي':'ابدأ الآن'}</button></div>`;
},

merchantAmount:()=>amountView(`<span class="to"><span class="avatar" style="background:var(--green)">${ic('store')}</span>${F.merchant}</span>`,'متابعة','merchantReview'),
requestAmount:()=>amountView(`<span class="to"><span class="avatar">${ic('receive')}</span>طلب مبلغ</span>`,'إنشاء رابط الطلب','requestDone',true),
topupAmount:()=>amountView(`<span class="to"><span class="avatar">${ic(F.method==='card'?'card':'bank')}</span>${F.methodName}</span>`,'متابعة','topupReview',true),
withdraw:()=>amountView(`<span class="to"><span class="avatar">${ic('withdraw')}</span>سحب نقدي من وكيل</span>`,'إنشاء رمز السحب','withdrawReview',false,'سحب نقدي'),

review:()=>`${appbar('مراجعة العملية')}<div class="content">
  <div class="review"><div class="hd"><small>${F.review.label}</small><b>${fmt(F.review.amount)} <small>د.ل</small></b></div>
  ${F.review.lines.map(([k,v])=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`).join('')}</div>
  ${F.review.note?`<div class="note"><span class="label">ملاحظة (اختياري)</span><div class="field"><input id="note" placeholder="مثال: إيجار الشهر"></div></div>`:''}
  <p class="muted" style="font-size:13px;margin-top:16px;display:flex;gap:8px;align-items:center">${ic('shield')}العملية محمية بالتشفير وتتطلب رمزك السري.</p>
  </div><div class="foot"><button class="btn" data-act="confirm">تأكيد ${F.review.verb||'الدفع'}</button></div>`,

processing:()=>`<div class="proc"><div><div class="spinner"></div><h3>جاري تنفيذ العملية…</h3><p class="muted" style="margin-top:6px">لا تغلق التطبيق</p></div></div>`,

success:()=>{const r=F.result;return `<div class="success"><div class="okc">${ic('check')}</div>
  <h2>${r.title}</h2>${r.amount!=null?`<div class="amtb">${fmt(r.amount)} <small>د.ل</small></div>`:''}
  ${r.code?`<div class="code-box">${r.code}</div><p class="muted" style="font-size:14px">${r.codeNote}</p>`:''}
  <div class="review">${r.lines.map(([k,v])=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`).join('')}</div></div>
  <div class="foot">${r.tx!=null?`<button class="btn line" data-act="share">${ic('share')}مشاركة الإيصال</button>`:''}<button class="btn" data-reset="home">العودة للرئيسية</button></div>`},

/* ---- receive ---- */
receive:()=>`${appbar('استلام الأموال')}<div class="content">
  <div class="qr-card"><b style="font-size:18px">${S.full}</b><p class="muted" style="font-size:14px">اطلب من المرسل مسح الرمز</p>
   <div class="qrw">${qrSVG(11)}<span class="mid"><svg viewBox="0 0 191 209"><use href="#mark" fill="#80B95A"/></svg></span></div>
   <button class="copy" data-act="copy">${S.wallet} ${ic('copy')}</button>
   <p class="muted" style="font-size:12px;margin-top:10px">رمز تجريبي للعرض فقط</p>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px">
   <button class="btn ghost" data-act="share">${ic('share')}مشاركة</button>
   <button class="btn ghost" data-go="requestAmount">${ic('receive')}طلب مبلغ</button>
  </div></div>
  <div class="foot"><button class="btn line" data-act="simReceive">محاكاة استلام 50 د.ل</button></div>`,

/* ---- scan ---- */
scan:()=>`<div class="camera"><div class="bgimg"></div>${statusBar(true)}
  <div class="top" style="top:50px"><button class="iconbtn" data-act="back" aria-label="رجوع">${ic('back')}</button><b>مسح رمز QR</b><button class="iconbtn" aria-label="الفلاش">${ic('flash')}</button></div>
  <div class="frame"><i></i><i></i><i></i><i></i><div class="qrfake">${qrSVG(23,'rgba(255,255,255,.9)')}</div><div class="line"></div></div>
  <p class="hint" id="scanHint">وجّه الكاميرا نحو رمز التاجر</p>
  <div class="bottom"><button data-go="receive">رمزي</button><button data-act="scanNow">إدخال الرمز يدوياً</button></div></div>`,

/* ---- bills ---- */
bills:()=>`${appbar('دفع الفواتير')}<div class="content">
  ${BILLERS.map((b,i)=>`<button class="list-item" data-biller="${i}"><span class="li">${ic(b.i)}</span><div><b>${b.n}</b><small>${b.d}</small></div>${ic('chev','chev')}</button>`).join('')}
  <span class="label">فواتير محفوظة</span>
  <button class="list-item" data-biller="0" data-saved="1"><span class="li" style="background:var(--paper)">${ic('bolt')}</span><div><b>كهرباء المنزل</b><small class="en">1002 4478 3310</small></div>${ic('chev','chev')}</button>
  </div>`,

billAccount:()=>{const b=F.biller;return `${appbar(b.n)}<div class="content">
  <span class="label">${b.label}</span><div class="field">${ic(b.i)}<input id="acc" class="en" inputmode="numeric" value="${F.acc||''}" placeholder="أدخل ${b.label}" style="text-align:right"></div>
  ${F.due?`<div class="bill-due">
    <div class="row"><span class="muted">اسم المشترك</span><b>${S.full}</b></div>
    <div class="row"><span class="muted">فترة الفاتورة</span><b>أكتوبر 2026</b></div>
    <div class="row"><span class="muted">تاريخ الاستحقاق</span><b>15 نوفمبر</b></div>
    <div class="row tot"><span>المبلغ المستحق</span><b>${fmt(F.due)} <small style="font:600 13px var(--font)">د.ل</small></b></div></div>`:''}
  </div><div class="foot">${F.due?`<button class="btn" data-act="billReview">دفع ${fmt(F.due)} د.ل</button>`:`<button class="btn" data-act="billFetch">استعلام عن الفاتورة</button>`}</div>`},

/* ---- recharge ---- */
recharge:()=>{F.op=F.op||'lby';F.rAmt=F.rAmt||10;return `${appbar('شحن رصيد الهاتف')}<div class="content">
  <span class="label" style="margin-top:4px">المشغّل</span>
  ${OPERATORS.map(o=>`<button class="list-item ${F.op===o.id?'sel':''}" data-op="${o.id}"><span class="op-logo" style="background:${o.c}">${o.n}</span><div><b>${o.n}</b><small>شحن فوري</small></div>${F.op===o.id?ic('check'):''}</button>`).join('')}
  <span class="label">رقم الهاتف</span><div class="field"><span class="pre">+218</span><input id="rph" class="en" inputmode="tel" value="${F.rph||S.phone}" style="text-align:left"></div>
  <span class="label">قيمة الشحن</span>
  <div class="chips">${[5,10,20,50,100].map(v=>`<button class="chip ${F.rAmt===v?'on':''}" data-ramt="${v}"><span class="en">${v}</span> د.ل</button>`).join('')}</div>
  </div><div class="foot"><button class="btn" data-act="rechargeReview">شحن <span class="en">${F.rAmt}</span> د.ل</button></div>`},

/* ---- topup ---- */
topup:()=>`${appbar('إيداع في المحفظة')}<div class="content">
  <button class="list-item" data-method="card"><span class="li">${ic('card')}</span><div><b>بطاقة مصرفية</b><small>إيداع فوري من بطاقتك المحلية</small></div>${ic('chev','chev')}</button>
  <button class="list-item" data-method="bank"><span class="li">${ic('bank')}</span><div><b>تحويل من حساب مصرفي</b><small>اربط حسابك المصرفي وحوّل منه</small></div>${ic('chev','chev')}</button>
  <button class="list-item" data-go="topupAgent"><span class="li">${ic('store')}</span><div><b>نقداً لدى وكيل</b><small>أكثر من 500 وكيل في ليبيا</small></div>${ic('chev','chev')}</button>
  <div class="card" style="margin-top:8px;background:var(--mint);border:0;display:flex;gap:10px;align-items:center">${ic('gift')}<span style="font-size:14px">لا رسوم على الإيداع خلال شهر نوفمبر.</span></div>
  </div>`,

topupAgent:()=>`${appbar('الإيداع لدى وكيل')}<div class="content">
  <div class="qr-card"><p class="muted" style="font-size:14px">اعرض هذا الرمز على الوكيل وسلّمه المبلغ</p>
   <div class="qrw" style="width:180px;height:180px">${qrSVG(5)}</div><button class="copy" data-act="copy">${S.wallet} ${ic('copy')}</button></div>
  <div class="agents"><span class="label">أقرب الوكلاء</span>${AGENTS.map(a=>`<div class="list-item"><span class="li">${ic('pin')}</span><div><b>${a.n}</b><small>${a.d}</small></div></div>`).join('')}</div>
  </div><div class="foot"><button class="btn line" data-act="simAgent">محاكاة إيداع 200 د.ل من الوكيل</button></div>`,

/* ---- history ---- */
history:()=>{F.filter=F.filter||'all';
  const flt={all:()=>true,in:t=>t.amount>0,out:t=>t.amount<0&&t.type!=='bill',bill:t=>t.type==='bill'||t.type==='recharge'}[F.filter];
  const items=S.tx.map((t,i)=>[t,i]).filter(([t])=>flt(t));
  const totalIn=S.tx.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0),totalOut=S.tx.filter(t=>t.amount<0).reduce((a,t)=>a-t.amount,0);
  return `<div class="appbar"><h3 style="padding-inline-start:4px">سجل المعاملات</h3><button class="iconbtn" aria-label="بحث">${ic('search')}</button></div>
  <div class="content">
   <div class="limits"><div><small>إجمالي الوارد</small><b style="color:#3E8E1F">+${fmt(totalIn)}</b></div><div><small>إجمالي الصادر</small><b>−${fmt(totalOut)}</b></div></div>
   <div class="chips" style="margin-bottom:8px">${[['all','الكل'],['in','وارد'],['out','صادر'],['bill','فواتير وشحن']].map(([k,t])=>`<button class="chip ${F.filter===k?'on':''}" data-filter="${k}">${t}</button>`).join('')}</div>
   ${items.length?items.map(([t,i])=>txRow(t,i)).join(''):'<p class="empty">لا توجد معاملات</p>'}
  </div>${tabbar('history')}`},

txdetail:()=>{const t=S.tx[F.txi];return `${appbar('تفاصيل العملية',`<button class="iconbtn" data-act="share" aria-label="مشاركة">${ic('share')}</button>`)}<div class="content">
  <div style="text-align:center;padding:10px 0 20px"><span class="tx"><span class="ti ${t.amount>0?'in':''}" style="width:72px;height:72px;margin:0 auto;border-radius:24px">${ic(TXI[t.type])}</span></span>
   <h3 style="margin-top:4px">${t.title}</h3><div class="amtb" style="font:800 34px var(--en);direction:ltr;margin-top:6px;color:${t.amount>0?'#3E8E1F':'inherit'}">${t.amount>0?'+':'−'}${fmt(t.amount)} <small style="font:700 16px var(--font);color:var(--muted)">د.ل</small></div></div>
  <div class="review">
   <div class="kv" style="border-top:0"><span>الحالة</span><b style="color:#3E8E1F">ناجحة ✓</b></div>
   <div class="kv"><span>التاريخ</span><b>${fdate(t.date)}</b></div>
   <div class="kv"><span>الرقم المرجعي</span><b class="en">${t.ref}</b></div>
   <div class="kv"><span>الرسوم</span><b>${money(t.fee||0)}</b></div>
   ${t.note?`<div class="kv"><span>ملاحظة</span><b>${t.note}</b></div>`:''}
  </div>
  <button class="btn ghost" style="margin-top:16px" data-act="toastHelp">${ic('help')}الإبلاغ عن مشكلة</button></div>`},

/* ---- profile / settings ---- */
profile:()=>`<div class="appbar"><h3 style="padding-inline-start:4px">حسابي</h3></div><div class="content">
  <div class="pro-head"><span class="avatar">${initials(S.name)}</span><h3>${S.full}</h3><small>+218 ${S.phone}</small></div>
  <div class="kyc"><div class="row"><b>مستوى التوثيق: موثّق</b><span style="font-size:13px">2 من 3</span></div><div class="bar"><i></i></div><small>أضف إثبات السكن للوصول إلى المستوى الذهبي ورفع حدودك.</small></div>
  <div class="limits"><div><small>الحد اليومي المتبقي</small><b>${fmt(5000)}</b></div><div><small>الحد الشهري</small><b>${fmt(30000)}</b></div></div>
  <div class="menu">
   <button data-reset="cards">${ic('card')}<span>البطاقة الافتراضية</span>${ic('chev','chev')}</button>
   <button data-go="notifs">${ic('bell')}<span>الإشعارات</span>${ic('chev','chev')}</button>
   <button data-act="changePin">${ic('lock')}<span>تغيير الرمز السري</span>${ic('chev','chev')}</button>
  </div>
  <div class="menu">
   <div class="mi">${ic('finger')}<span>الدخول بالبصمة</span><button class="switch ${S.bio?'on':''}" data-act="bio" aria-label="البصمة"></button></div>
   <div class="mi">${ic('bell')}<span>إشعارات العمليات</span><button class="switch ${S.notifOn?'on':''}" data-act="notifOn" aria-label="الإشعارات"></button></div>
   <button data-act="lang">${ic('globe')}<span>اللغة</span><small class="muted">العربية</small></button>

  <div class="menu"><button class="danger" data-act="logout">${ic('logout')}<span>تسجيل الخروج</span></button></div>
  </div>${tabbar('profile')}`,

   <div class="mi">${ic('snow')}<span>تجميد البطاقة مؤقتاً</span><button class="switch ${S.frozen?'on':''}" data-act="freeze" aria-label="تجميد"></button></div>
   <button data-act="showCard">${ic('eye')}<span>عرض بيانات البطاقة</span>${ic('chev','chev')}</button>
   <button data-act="toastHelp">${ic('globe')}<span>الشراء من المواقع الدولية</span><small class="muted">مفعّل</small></button>
  </div></div>${tabbar('cards')}`,

notifs:()=>{S.unread=0;return `${appbar('الإشعارات')}<div class="content">
  ${S.notifs.map(n=>`<div class="notif"><span class="ti">${ic(n.i)}</span><div><b>${n.t}</b><p>${n.d}</p><small>${fdate(n.date)}</small></div></div>`).join('')}</div>`}
};

function amountView(head,cta,next,noBalCheck,title){
  F.amt=F.amt||'';F.next=next;F.noBal=noBalCheck;
  return `${appbar(title||'')}<div class="content" style="display:flex;flex-direction:column;padding-bottom:6px">
   <div class="amount-view">${head}<div class="big" id="amtBig">0<small>د.ل</small></div><div class="bal" id="amtBal"></div>
   <div class="preset">${[10,50,100,250].map(v=>`<button data-preset="${v}">${v}</button>`).join('')}</div></div>
   <div style="margin-top:auto">${keypad()}</div></div>
   <div class="foot"><button class="btn" id="amtBtn" data-act="amtNext" disabled>${cta}</button></div>`;
}
function updAmt(){
  const big=document.getElementById('amtBig');if(!big)return;
  const v=parseFloat(F.amt||'0');
  big.innerHTML=(F.amt||'0')+'<small>د.ل</small>';
  const bal=document.getElementById('amtBal'),btn=document.getElementById('amtBtn');
  const fee=F.next==='withdrawReview'?v*.01:0;
  const over=!F.noBal&&v+fee>S.balance;
  bal.className='bal'+(over?' err':'');
  bal.innerHTML=over?'الرصيد غير كافٍ':`الرصيد المتاح ${money(S.balance)}`;
  btn.disabled=!(v>0)||over;
}

/* =========================================================
   Router
   ========================================================= */
const scr=document.getElementById('screen');
function render(dir=0){
  const n=stack[stack.length-1];
  const body=V[n]();
  scr.innerHTML=`<div class="scr in-${dir}">${n==='scan'?'':statusBar()}${body}</div>`;
  const [t,d,l]=INFO[n]||['',''];
  document.getElementById('now-t').textContent=t;
  document.getElementById('now-d').textContent=d;
  document.getElementById('now-l').innerHTML=(l||[]).map(x=>`<li>${x}</li>`).join('');
  (HOOK[n]||(()=>{}))();
}
function go(n){stack.push(n);render(1)}
function back(){clearTimeout(T);if(stack.length>1){stack.pop();render(-1)}}
function reset(n){clearTimeout(T);stack=[n];render(0)}
let T;
const HOOK={
  splash:()=>{T=setTimeout(()=>{stack=['onboard'];render(0)},1700)},
  otp:()=>{const boxes=[...document.querySelectorAll('#otp span')];let i=0;
    const step=()=>{if(stack.at(-1)!=='otp')return;if(i<6){boxes[i].textContent='123456'[i];boxes[i].classList.add('f');i++;T=setTimeout(step,170)}else document.getElementById('otpBtn').disabled=false};
    T=setTimeout(step,700)},
  scan:()=>{T=setTimeout(()=>{if(stack.at(-1)==='scan'){document.getElementById('scanHint').textContent='تم التعرّف على الرمز ✓';T=setTimeout(scanFound,500)}},2000)},
  processing:()=>{T=setTimeout(()=>{stack.pop();stack.pop();stack.push('success');render(1)},1300)},
  sendAmount:updAmt,merchantAmount:updAmt,requestAmount:updAmt,topupAmount:updAmt,withdraw:updAmt
};
function scanFound(){F.merchant='مقهى المدينة';F.amt='';stack.pop();go('merchantAmount')}

/* =========================================================
   PIN sheet
   ========================================================= */
function askPin(cb,title='أدخل الرمز السري',sub='لتأكيد العملية'){
  let pin='';const dev=document.getElementById('device');
  const bg=document.createElement('div');bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet"><div class="grab"></div><h4>${title}</h4><p>${sub}</p>
   <div class="pins" id="pins">${'<i></i>'.repeat(4)}</div>
   ${S.bio?`<button class="bio" data-pin-bio>${ic('finger')}استخدم البصمة</button>`:''}${keypad()}</div>`;
  dev.appendChild(bg);
  const dots=()=>bg.querySelectorAll('.pins i').forEach((d,i)=>d.classList.toggle('f',i<pin.length));
  const done=()=>{bg.remove();cb()};
  bg.addEventListener('click',e=>{
    if(e.target===bg){bg.remove();return}
    if(e.target.closest('[data-pin-bio]')){bg.querySelector('.bio').textContent='جاري التحقق…';setTimeout(done,700);return}
    const k=e.target.closest('[data-key]');if(!k)return;e.stopPropagation();
    const v=k.dataset.key;
    if(v==='del')pin=pin.slice(0,-1);else if(v!=='.'&&pin.length<4)pin+=v;
    dots();
    if(pin.length===4){
      if(pin==='1234')setTimeout(done,150);
      else{const p=bg.querySelector('.pins');p.classList.add('shake');bg.querySelector('p').textContent='رمز غير صحيح — جرّب 1234';setTimeout(()=>{p.classList.remove('shake');pin='';dots()},450)}
    }
  });
}

/* =========================================================
   Toast
   ========================================================= */
let TT;
function toast(t,s,i='check'){
  document.getElementById('toast-t').textContent=t;
  document.getElementById('toast-s').textContent=s||'';
  document.getElementById('toast-i').innerHTML=ic(i);
  const el=document.getElementById('toast');el.classList.add('show');
  clearTimeout(TT);TT=setTimeout(()=>el.classList.remove('show'),2600);
}

/* =========================================================
   Flow helpers
   ========================================================= */
function startReview(o){F.review=o;go('review')}
function finish(res){F.result=res;go('processing')}
const nowStr=()=>fdate(new Date());

const ACT={
  back,restart:()=>{S=S0();F={};obIndex=0;reset('splash')},
  toLogin:()=>reset('login'),
  obNext:()=>{if(obIndex<2){obIndex++;render(1)}else reset('login')},
  otpOk:()=>askPin(()=>{S.logged=true;reset('home');setTimeout(()=>toast('مرحباً بعودتك، '+S.name,'تم تسجيل الدخول بنجاح','shield'),400)},'أدخل الرمز السري','لتسجيل الدخول إلى محفظتك'),
  toggleBal:()=>{S.hidden=!S.hidden;render(0)},
  sendToNum:()=>{const v=(document.getElementById('toNum').value||'').trim();
    if(v.replace(/\D/g,'').length<9){toast('أدخل رقماً صحيحاً','مثال: 092 555 1212','help');return}
    F.to={n:v,p:v};F.amt='';go('sendAmount')},
  amtNext:()=>ACT[F.next](),
  sendReview:()=>{const a=+F.amt;startReview({kind:'send',amount:a,label:'تحويل إلى',verb:'التحويل',note:true,
    lines:[['المستلم',F.to.n],['رقم الهاتف',`<span class="en">${F.to.p}</span>`],['الرسوم','مجاناً'],['الإجمالي',money(a)]]})},
  merchantReview:()=>{const a=+F.amt;startReview({kind:'merchant',amount:a,label:'الدفع إلى '+F.merchant,
    lines:[['التاجر',F.merchant],['رقم التاجر','<span class="en">MR-00417</span>'],['الرسوم','مجاناً'],['الإجمالي',money(a)]]})},
  requestDone:()=>{const a=+F.amt;F.result={title:'تم إنشاء طلب الدفع',amount:a,lines:[['الرابط','<span class="en">sadad.ly/r/7Q2K</span>'],['صالح حتى','24 ساعة']]};stack.pop();go('success');toast('تم نسخ رابط الطلب','أرسله لأي شخص ليدفع لك','copy')},
  topupReview:()=>{const a=+F.amt;startReview({kind:'topup',amount:a,label:'إيداع في المحفظة',verb:'الإيداع',
    lines:[['المصدر',F.methodName],[F.method==='card'?'البطاقة':'الحساب',`<span class="en">${F.method==='card'?'•••• 8812':'LY•• •••• 3301'}</span>`],['الرسوم','مجاناً'],['الإجمالي',money(a)]]})},
  withdrawReview:()=>{const a=+F.amt,fee=+(a*.01).toFixed(3);startReview({kind:'withdraw',amount:a,fee,label:'سحب نقدي',verb:'السحب',
    lines:[['طريقة الاستلام','نقداً من وكيل'],['الرسوم (1%)',money(fee)],['الإجمالي المخصوم',money(a+fee)]]})},
  billFetch:()=>{const v=(document.getElementById('acc').value||'').trim();
    if(v.replace(/\D/g,'').length<6){toast('رقم غير صحيح','أدخل 6 أرقام على الأقل','help');return}
    F.acc=v;F.due=[63.25,18.5,95,40][BILLERS.indexOf(F.biller)];render(0)},
  billReview:()=>startReview({kind:'bill',amount:F.due,label:F.biller.n,
    lines:[['الجهة',F.biller.n],[F.biller.label,`<span class="en">${F.acc}</span>`],['الفترة','أكتوبر 2026'],['الرسوم','مجاناً'],['الإجمالي',money(F.due)]]}),
  rechargeReview:()=>{const ph=document.getElementById('rph').value.trim();F.rph=ph;const op=OPERATORS.find(o=>o.id===F.op);
    if(F.rAmt>S.balance){toast('الرصيد غير كافٍ','','help');return}
    startReview({kind:'recharge',amount:F.rAmt,label:'شحن رصيد '+op.n,verb:'الشحن',lines:[['المشغّل',op.n],['الرقم',`<span class="en">+218 ${ph}</span>`],['الرسوم','مجاناً'],['الإجمالي',money(F.rAmt)]]})},
  confirm:()=>{
    const r=F.review,note=(document.getElementById('note')||{}).value||'';
    askPin(()=>{
      let tx,res;
      if(r.kind==='send'){tx=addTx({type:'send',title:'تحويل إلى '+F.to.n,amount:-r.amount,note});res={title:'تم التحويل بنجاح',amount:r.amount,lines:[['إلى',F.to.n],['التاريخ',nowStr()],['الرقم المرجعي',`<span class="en">${tx.ref}</span>`]]}}
      if(r.kind==='merchant'){tx=addTx({type:'merchant',title:F.merchant,amount:-r.amount});res={title:'تم الدفع بنجاح',amount:r.amount,lines:[['التاجر',F.merchant],['التاريخ',nowStr()],['الرقم المرجعي',`<span class="en">${tx.ref}</span>`]]}}
      if(r.kind==='topup'){tx=addTx({type:'topup',title:'إيداع من '+F.methodName,amount:r.amount});res={title:'تم الإيداع بنجاح',amount:r.amount,lines:[['المصدر',F.methodName],['الرصيد الجديد',money(S.balance)],['الرقم المرجعي',`<span class="en">${tx.ref}</span>`]]}}
      if(r.kind==='bill'){tx=addTx({type:'bill',title:'فاتورة '+F.biller.n,amount:-r.amount});res={title:'تم دفع الفاتورة',amount:r.amount,lines:[['الجهة',F.biller.n],[F.biller.label,`<span class="en">${F.acc}</span>`],['الرقم المرجعي',`<span class="en">${tx.ref}</span>`]]}}
      if(r.kind==='recharge'){const op=OPERATORS.find(o=>o.id===F.op);tx=addTx({type:'recharge',title:'شحن رصيد '+op.n,amount:-r.amount});res={title:'تم شحن الرصيد',amount:r.amount,lines:[['الرقم',`<span class="en">+218 ${F.rph}</span>`],['المشغّل',op.n],['الرقم المرجعي',`<span class="en">${tx.ref}</span>`]]}}
      if(r.kind==='withdraw'){tx=addTx({type:'withdraw',title:'سحب نقدي من وكيل',amount:-(r.amount+r.fee),fee:r.fee});const code=String(Math.floor(100000+Math.random()*899999));
        res={title:'رمز السحب جاهز',amount:r.amount,code,codeNote:'قدّم هذا الرمز لأي وكيل سداد ليبيا · صالح 30 دقيقة',lines:[['الرسوم',money(r.fee)],['الرقم المرجعي',`<span class="en">${tx.ref}</span>`]]}}
      res.tx=0;F.amt='';finish(res);
    });
  },
  simReceive:()=>{const c=CONTACTS[2];addTx({type:'receive',title:'استلام من '+c.n,amount:50});S.unread++;S.notifs.unshift({i:'receive',t:'استلمت 50.000 د.ل',d:'من '+c.n,date:new Date()});toast('استلمت 50.000 د.ل','من '+c.n+' — الرصيد الآن '+fmt(S.balance),'receive')},
  simAgent:()=>{addTx({type:'topup',title:'إيداع نقدي لدى وكيل',amount:200});toast('تم إيداع 200.000 د.ل','الرصيد الآن '+fmt(S.balance),'topup')},
  scanNow:()=>{clearTimeout(T);scanFound()},
  copy:()=>toast('تم النسخ',S.wallet,'copy'),
  share:()=>toast('جاهز للمشاركة','تم تجهيز الإيصال للمشاركة','share'),
  toastHelp:()=>toast('فريق الدعم متاح 24/7','هذه ميزة توضيحية في النسخة التجريبية','help'),
  lang:()=>toast('اللغة','العربية والإنجليزية متاحتان في النسخة الكاملة','globe'),
  bio:()=>{S.bio=!S.bio;render(0)},notifOn:()=>{S.notifOn=!S.notifOn;render(0)},
  freeze:()=>{S.frozen=!S.frozen;render(0);toast(S.frozen?'تم تجميد البطاقة':'تم تفعيل البطاقة',S.frozen?'لن تُقبل أي عملية حتى تفعيلها':'يمكنك الشراء الآن',S.frozen?'snow':'check')},
  showCard:()=>askPin(()=>toast('5294 1180 6673 4471','CVV 318 · تنتهي 11/29','card'),'عرض بيانات البطاقة','أدخل رمزك السري'),
  changePin:()=>askPin(()=>toast('تم التحقق','يمكنك الآن تعيين رمز جديد (توضيحي)','lock'),'الرمز السري الحالي','أدخل رمزك الحالي للمتابعة'),
  logout:()=>{S.logged=false;reset('login')}
};

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-go],[data-reset],[data-key],[data-preset],[data-contact],[data-tx],[data-biller],[data-op],[data-ramt],[data-method],[data-filter],[data-demo]');
  if(!el||el.closest('.sheet-bg'))return;
  const d=el.dataset;
  if(d.demo){S.logged=true;clearTimeout(T);F={};
    const tabs=['history','cards','profile'];stack=tabs.includes(d.demo)?[d.demo]:['home',d.demo];
    if(window.innerWidth<=980)document.getElementById('device').scrollIntoView({behavior:'smooth'});
    render(1);return}
  if(d.act)return ACT[d.act]();
  if(d.go){if(['sendAmount','requestAmount','withdraw','merchantAmount'].includes(d.go)||d.go==='withdraw')F.amt='';if(d.go==='bills'){F.due=null;F.acc=''}if(d.go==='recharge'){F.rAmt=10;F.rph=''}return go(d.go)}
  if(d.reset){F.filter=d.reset==='history'?'all':F.filter;return reset(d.reset)}
  if(d.key){let a=F.amt||'';const k=d.key;
    if(k==='del')a=a.slice(0,-1);
    else if(k==='.'){if(!a.includes('.'))a=(a||'0')+'.'}
    else{if(a.includes('.')&&a.split('.')[1].length>=3)return;if(a==='0')a='';if(a.replace('.','').length>=7)return;a+=k}
    F.amt=a;return updAmt()}
  if(d.preset){F.amt=d.preset;return updAmt()}
  if(d.contact!=null){F.to=CONTACTS[+d.contact];F.amt='';return go('sendAmount')}
  if(d.tx!=null){F.txi=+d.tx;return go('txdetail')}
  if(d.biller!=null){F.biller=BILLERS[+d.biller];F.acc=d.saved?'1002 4478 3310':'';F.due=null;return go('billAccount')}
  if(d.op){F.rph=(document.getElementById('rph')||{}).value||F.rph;F.op=d.op;return render(0)}
  if(d.ramt){F.rph=(document.getElementById('rph')||{}).value||F.rph;F.rAmt=+d.ramt;return render(0)}
  if(d.method){F.method=d.method;F.methodName=d.method==='card'?'بطاقة مصرفية':'حساب مصرفي';F.amt='';return go('topupAmount')}
  if(d.filter){F.filter=d.filter;return render(0)}
});
setInterval(()=>{const s=document.querySelector('.status span');if(s)s.textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})},30000);
render(0);
</script>
