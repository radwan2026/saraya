/* Layout: brown masthead + tab strip, one centered working column; receipts render on fixed "paper" tokens so prints look the same in both themes. */
:root {
  --bg: #f6f0e7;
  --surface: #fffdf9;
  --surface-2: #faf4ea;
  --line: #e6d8c2;
  --ink: #2c1d12;
  --muted: #7b6956;
  --brand: #5b3a22;
  --brand-deep: #3e2615;
  --brand-ink: #fdf6ea;
  --gold: #b48637;
  --gold-soft: #f2e4c6;
  --danger: #a63d2c;
  --danger-soft: #f7e3de;
  --ok: #3f7445;
  --ok-soft: #e3efe1;
  --focus: #c79a4b;
  /* paper: fixed in both themes, it is a printed document */
  --paper: #ffffff;
  --paper-ink: #2c1d12;
  --paper-muted: #7b6956;
  --paper-brown: #5b3a22;
  --paper-gold: #b48637;
  --paper-line: #e2d3ba;
  --paper-tint: #faf4ea;
  --font-body: "A Jannat LT", Tahoma, "Segoe UI", sans-serif;
  --font-display: "A Jannat LT", Tahoma, "Segoe UI", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #19120d; --surface: #241a13; --surface-2: #2c2018; --line: #3e2f22;
    --ink: #f2e8da; --muted: #b6a38c; --brand: #4a2e1a; --brand-deep: #33200f;
    --brand-ink: #fbf1e1; --gold: #d3a654; --gold-soft: #3b2c1a;
    --danger: #e0806d; --danger-soft: #3a1f19; --ok: #8cc58f; --ok-soft: #1f2e20; --focus: #d9ad5c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #19120d; --surface: #241a13; --surface-2: #2c2018; --line: #3e2f22;
  --ink: #f2e8da; --muted: #b6a38c; --brand: #4a2e1a; --brand-deep: #33200f;
  --brand-ink: #fbf1e1; --gold: #d3a654; --gold-soft: #3b2c1a;
  --danger: #e0806d; --danger-soft: #3a1f19; --ok: #8cc58f; --ok-soft: #1f2e20; --focus: #d9ad5c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand); }
#app { min-height: 100vh; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num, td.n { font-variant-numeric: tabular-nums; }

/* ---------- buttons & fields ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45em; border: 1px solid transparent; border-radius: 8px; padding: .62em 1.25em; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn-primary { background: var(--brand); color: var(--brand-ink); }
.btn-primary:hover { background: var(--brand-deep); }
.btn-gold { background: var(--gold); color: #fff; }
.btn-gold:hover { filter: brightness(.95); }
.btn-ghost { background: transparent; border-color: var(--brand); color: var(--ink); }
.btn-ghost:hover { background: var(--gold-soft); }
.btn-sm { padding: .3em .8em; font-size: 13px; border-radius: 6px; }
.btn-chip { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); }
.btn-chip:hover { border-color: var(--gold); }
.btn-x { background: none; border: 0; color: var(--danger); font-size: 18px; line-height: 1; padding: .2em .45em; cursor: pointer; border-radius: 6px; }
.btn-x:hover { background: var(--danger-soft); }
.btn[disabled] { opacity: .5; cursor: progress; }
label.f { display: flex; flex-direction: column; gap: .35em; font-size: 13px; font-weight: 700; color: var(--muted); min-width: 0; }
.field { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: .62em .8em; color: var(--ink); min-height: 44px; }
.field:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent); }
.field[readonly] { background: var(--surface-2); }
textarea.field { min-height: 70px; resize: vertical; }
.grid { display: grid; gap: 16px 16px; }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 720px) { .g3, .g2 { grid-template-columns: minmax(0, 1fr); } }

/* ---------- login ---------- */
.auth { min-height: 100vh; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at top, var(--gold-soft), transparent 60%), var(--bg); }
.auth-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 32px 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 18px 40px -24px rgba(62, 38, 21, .45); }
.auth-logo { align-self: center; width: 210px; max-width: 100%; height: auto; }
.logo-chip { background: #fff; }
.auth-sub { text-align: center; color: var(--muted); font-size: 14px; margin: -6px 0 4px; }
.auth h2 { font-family: var(--font-display); color: var(--brand); text-align: center; font-size: 20px; }
:root[data-theme="dark"] .auth h2 { color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .auth h2 { color: var(--gold); } }
.note { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; line-height: 1.75; }
.err { color: var(--danger); font-size: 13px; min-height: 1.2em; }

/* ---------- masthead ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.mast { background: var(--brand); color: var(--brand-ink); border-bottom: 3px solid var(--gold); }
.mast-in, .tabs-in, .main { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mast-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand .logo-chip { border-radius: 8px; padding: 4px 8px; display: flex; }
.brand .logo-chip img { height: 40px; width: auto; display: block; }
.brand b { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.who { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.role { background: var(--gold); color: #fff; border-radius: 99px; padding: .1em .75em; font-size: 12px; font-weight: 700; }
.mast .btn-ghost { border-color: color-mix(in srgb, var(--brand-ink) 55%, transparent); color: var(--brand-ink); }
.mast .btn-ghost:hover { background: rgba(255,255,255,.08); }
.tabs { background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs-in { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 14px 16px 11px; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--brand); border-bottom-color: var(--gold); }
:root[data-theme="dark"] .tab[aria-current="page"] { color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tab[aria-current="page"] { color: var(--gold); } }
.banner { background: var(--gold-soft); color: var(--ink); font-size: 13px; text-align: center; padding: 6px 16px; }

.main { padding-block: 26px 60px; display: flex; flex-direction: column; gap: 22px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; min-width: 0; }
@media (max-width: 560px) { .card { padding: 18px 14px; } }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.ttl { font-size: 18px; font-weight: 700; color: var(--ink); padding-inline-start: 12px; border-inline-start: 4px solid var(--gold); line-height: 1.3; }
.sec { font-size: 14.5px; font-weight: 700; color: var(--brand); padding-bottom: 8px; border-bottom: 2px solid var(--gold-soft); margin: 26px 0 16px; }
:root[data-theme="dark"] .sec { color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sec { color: var(--gold); } }
.sec:first-of-type { margin-top: 4px; }

/* ---------- tables ---------- */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
.t th { background: var(--surface-2); color: var(--ink); font-weight: 700; text-align: center; padding: 11px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 10px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t tbody tr:hover td { background: color-mix(in srgb, var(--gold-soft) 45%, transparent); }
.t td.names { text-align: right; max-width: 220px; font-size: 13px; color: var(--muted); }
.t .acts { display: flex; gap: 6px; justify-content: center; flex-wrap: nowrap; }
.names-t td { padding: 4px 8px; }
.names-t .field { border: 0; background: transparent; text-align: center; min-height: 38px; }
.names-t .field:focus { box-shadow: none; background: var(--surface-2); }
.empty { padding: 34px 16px; text-align: center; color: var(--muted); }

/* ---------- dashboard ---------- */
.hello { display: flex; justify-content: space-between; align-items: end; gap: 14px; flex-wrap: wrap; }
.hello h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; color: var(--brand); }
:root[data-theme="dark"] .hello h1 { color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hello h1 { color: var(--gold); } }
.hello p { margin: 2px 0 0; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 860px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat span { color: var(--muted); font-size: 13px; font-weight: 700; }
.stat b { font-size: 26px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; }
.stat.hero { background: var(--brand); border-color: var(--brand); }
.stat.hero span, .stat.hero small { color: color-mix(in srgb, var(--brand-ink) 75%, transparent); }
.stat.hero b { color: var(--brand-ink); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .grow b { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .grow small { color: var(--muted); }
.pill { font-size: 12px; font-weight: 700; border-radius: 99px; padding: .15em .7em; white-space: nowrap; background: var(--gold-soft); color: var(--ink); font-variant-numeric: tabular-nums; }
.pill.soon { background: var(--danger-soft); color: var(--danger); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.datebox { width: 48px; flex: none; text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 3px 0; line-height: 1.15; background: var(--surface-2); }
.datebox b { display: block; font-size: 18px; color: var(--brand); }
:root[data-theme="dark"] .datebox b { color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .datebox b { color: var(--gold); } }
.datebox small { font-size: 11px; color: var(--muted); }

/* ---------- uploads ---------- */
.drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 16px; background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.drop small { color: var(--muted); font-size: 12px; }
.files { display: flex; flex-wrap: wrap; gap: 6px; }
.file { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 2px 6px 2px 10px; font-size: 12.5px; max-width: 100%; }
.file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
.file .btn-x { font-size: 15px; }
.formbar { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }

/* ---------- modal & toast ---------- */
.ov { position: fixed; inset: 0; z-index: 50; background: rgba(30, 18, 9, .55); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.md { background: var(--surface); border-radius: 16px; width: 100%; max-width: 480px; padding: 22px; display: flex; flex-direction: column; gap: 16px; border: 1px solid var(--line); }
.md.wide { max-width: 900px; }
.md-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.md-h h3 { font-size: 17px; }
.md-acts { display: flex; gap: 10px; flex-wrap: wrap; }
.paperwrap { overflow-x: auto; background: var(--surface-2); border-radius: 12px; padding: 14px; border: 1px solid var(--line); }
.toasts { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 420px); }
.toast { background: var(--brand-deep); color: var(--brand-ink); border-radius: 10px; padding: 10px 16px; font-size: 14px; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); text-align: center; }
.toast.error { background: var(--danger); color: #fff; }
.wa-steps { margin: 0; padding-inline-start: 20px; color: var(--muted); font-size: 13.5px; }
.preview-img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
.loading { min-height: 100vh; display: grid; place-items: center; color: var(--muted); }

/* ---------- the printed receipt ---------- */
.receipt { width: 794px; background: var(--paper); color: var(--paper-ink); font-family: var(--font-body); direction: rtl; margin: 0 auto; font-size: 14px; line-height: 1.55; }
.rc-hero { position: relative; height: 257px; overflow: hidden; background: var(--paper-brown); }
.rc-hero .bg { position: absolute; left: 0; top: 0; width: 794px; height: 257px; max-width: none; display: block; }
.rc-plate { position: absolute; top: 8px; left: 317px; width: 160px; height: 138px; background: rgba(255, 255, 255, .86); border-radius: 18px; display: flex; align-items: center; justify-content: center; }
.rc-plate img { width: 136px; height: auto; display: block; }
.rc-ribbon { position: relative; margin-top: -24px; height: 46px; background: var(--paper-brown); border-radius: 26px 26px 0 0; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; color: #fff; font-size: 15px; }
.rc-ribbon .st { color: var(--paper-gold); font-size: 17px; }
.rc-ribbon .en { direction: ltr; font-family: Tahoma, "Segoe UI", sans-serif; font-size: 13.5px; }
.rc-body { padding: 0 30px 26px; }
.rc-title { text-align: center; font-weight: 700; font-size: 25px; color: var(--paper-brown); padding: 20px 0 12px; border-bottom: 3px solid var(--paper-gold); margin: 0; }
.rc-h { margin: 18px 0 10px; background: var(--paper-tint); border-right: 4px solid var(--paper-gold); padding: 7px 14px; font-weight: 700; color: var(--paper-brown); font-size: 15px; border-radius: 3px; }
.rc-box { border: 1px solid var(--paper-line); border-radius: 8px; overflow: hidden; }
.rc-g { width: 100%; border-collapse: collapse; table-layout: fixed; }
.rc-g th, .rc-g td { padding: 8px 12px; border-bottom: 1px solid var(--paper-line); text-align: center; vertical-align: middle; }
.rc-g tr:last-child th, .rc-g tr:last-child td { border-bottom: 0; }
.rc-g th { background: var(--paper-tint); color: var(--paper-ink); font-weight: 700; text-align: right; width: 18%; }
.rc-g td + th { border-right: 1px solid var(--paper-line); }
.rc-g td { width: 32%; }
.rc-g td.strong { font-weight: 700; color: var(--paper-brown); font-size: 16px; }
.rc-n { width: 100%; border-collapse: collapse; }
.rc-n th, .rc-n td { padding: 7px 12px; border-bottom: 1px solid var(--paper-line); text-align: center; }
.rc-n tr:last-child td { border-bottom: 0; }
.rc-n th { background: var(--paper-tint); font-weight: 700; }
.rc-n th:first-child, .rc-n td:first-child { width: 60px; border-left: 1px solid var(--paper-line); }
.rc-n td.none { color: var(--paper-muted); }
.rc-text { padding: 10px 14px; min-height: 42px; white-space: pre-wrap; }
.rc-sign { display: flex; justify-content: space-between; margin-top: 34px; }
.rc-sign div { width: 190px; border-top: 1px dashed var(--paper-line); padding-top: 6px; text-align: center; color: var(--paper-muted); font-size: 13px; }
.rc-foot { margin-top: 18px; color: var(--paper-muted); font-size: 11.5px; }
.offscreen { position: absolute; left: -10000px; top: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

const errMsg = e => {
  const c = e && e.code;
  if (c === "not_granted" || c === "capability_disabled") return "ليست لديك صلاحية الحفظ في هذه المنظومة. اطلب من المالك صلاحية «مساهم».";
  if (c === "declined") return "تم إلغاء الحفظ.";
  if (c === "too_large") return "الملف أكبر من المسموح.";
  return (e && e.message) || "حدث خطأ غير متوقع.";
};

/* ---------- storage: shared db when available, this browser otherwise ---------- */
const Store = {
  mode: "pending", db: null, assets: null, downloads: null,
  data: { receipts: [], users: [] }, ready: { receipts: false, users: false },
  async init() {
    let db = null;
    if (window.claude && window.claude.use) { try { db = await window.claude.use("db"); } catch { db = null; } }
    if (db) {
      this.mode = "db"; this.db = db;
      for (const c of ["receipts", "users"]) {
        db.collection(c).onSnapshot(snap => {
          this.data[c] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
          this.ready[c] = true; onData();
        }, e => toast("تعذر تحميل البيانات: " + errMsg(e), "error"));
      }
      window.claude.use("assets").then(a => { this.assets = a; }).catch(() => {});
    } else {
      this.mode = "local";
      for (const c of ["receipts", "users"]) { this.data[c] = lsGet(c, []); this.ready[c] = true; }
      window.addEventListener("storage", e => {
        if (!e.key || !e.key.startsWith(LS)) return;
        const c = e.key.slice(LS.length); if (c in this.data) { this.data[c] = lsGet(c, []); onData(); }
      });
      onData();
    }
    if (window.claude && window.claude.use) window.claude.use("downloads").then(d => { this.downloads = d; }).catch(() => {});
  },
  async set(c, id, doc) {
    if (this.mode === "db") return this.db.collection(c).doc(id).set(doc);
    const arr = this.data[c].filter(x => x.id !== id); arr.push({ ...doc, id });
    if (!lsSet(c, arr)) throw new Error("مساحة التخزين في المتصفح ممتلئة. احذف بعض المرفقات أو السجلات القديمة.");
    this.data[c] = arr; onData();
  },
  async remove(c, id) {
    if (this.mode === "db") return this.db.collection(c).doc(id).delete();
    this.data[c] = this.data[c].filter(x => x.id !== id); lsSet(c, this.data[c]); onData();
  },
  async upload(file) {
    if (this.mode === "db") {
      if (!this.assets) throw new Error("رفع المرفقات غير متاح لصلاحيتك الحالية.");
      const r = await this.assets.upload(file, { type: file.type || undefined });
      return { name: file.name, type: r.contentType, url: r.url, assetId: r.id, size: r.sizeBytes };
    }
    const url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); });
    return { name: file.name, type: file.type, url, size: file.size };
  },
  async save(filename, data) {
    if (!this.downloads && !window.claude) {
      // standalone file opened directly in a browser: a normal download link works
      const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
      const a = document.createElement("a"); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
      return { status: "saved" };
    }
    if (!this.downloads) throw new Error("التنزيل غير متاح في هذه النافذة. افتح المنظومة من claude.ai.");
    return this.downloads.save({ filename, data });
  },
};

function bindAuth() {
  const sf = $("#setupF");
  if (sf) sf.addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("#su_name").value.trim(), user = $("#su_user").value.trim().toLowerCase(), p = $("#su_pass").value, p2 = $("#su_pass2").value;
    const err = $("#su_err");
    if (!name || !user) return err.textContent = "أدخل الاسم واسم المستخدم.";
    if (p.length < 4) return err.textContent = "كلمة المرور 4 أحرف على الأقل.";
    if (p !== p2) return err.textContent = "كلمتا المرور غير متطابقتين.";
    const id = uid("u_"), salt = uid("s");
    try {
      lsSet("uid", id);
      await Store.set("users", id, { name, username: user, role: "admin", active: true, salt, hash: await sha(salt + ":" + p), createdAt: new Date().toISOString() });
    } catch (x) { err.textContent = errMsg(x); }
  });
  const lf = $("#loginF");
  if (lf) lf.addEventListener("submit", async e => {
    e.preventDefault();
    const user = $("#li_user").value.trim().toLowerCase(), p = $("#li_pass").value, err = $("#li_err");
    const u = Store.data.users.find(x => x.username === user);
    if (!u || u.hash !== await sha(u.salt + ":" + p)) return err.textContent = "اسم المستخدم أو كلمة المرور غير صحيحة.";
    if (u.active === false) return err.textContent = "هذا الحساب موقوف. راجع المدير العام.";
    lsSet("uid", u.id); screen = "app"; renderScreen();
  });
}

function go(v, opts = {}) {
  if (v === "form" && !opts.keepEdit) editingId = null;

function renderView() {
  const el = $("#view"); if (!el) return;
  if (view === "dash") el.innerHTML = dashHTML();

  else if (view === "records") { el.innerHTML = recordsHTML(); bindRecords(); }
  else if (view === "users") { el.innerHTML = usersHTML(); bindUsers(); }
  bindCommon(el);

/* data changed elsewhere: refresh read-only views, never wipe a form being typed */
function refreshView() {
  if (!me()) { screen = "login"; renderScreen(); return; }
  if (view === "dash") renderView();
  else if (view === "records") { const t = $("#recBody"); if (t) { t.innerHTML = recordRows(); $("#recHead").innerHTML = recordsHead(); bindCommon($("#view")); } }
  else if (view === "users") { const t = $("#usersBody"); if (t) { t.innerHTML = userRows(); bindCommon($("#view")); } }
}
function bindCommon(root) {
  $$("[data-show]", root).forEach(b => b.onclick = () => showReceipt(b.dataset.show));
  $$("[data-edit]", root).forEach(b => b.onclick = () => { editingId = b.dataset.edit; go("form", { keepEdit: true }); });
  $$("[data-del]", root).forEach(b => b.onclick = () => confirmDelete(b.dataset.del));
  $$("[data-files]", root).forEach(b => b.onclick = () => showFiles(b.dataset.files));
  $$("[data-go]", root).forEach(b => b.onclick = () => go(b.dataset.go));
}

  $("#f_net").addEventListener("input", () => { netTouched = true; });
  const calc = () => { if (!netTouched) $("#f_net").value = (num($("#f_price").value) + num($("#f_extraPrice").value)) || ""; };
  $("#f_price").addEventListener("input", calc); $("#f_extraPrice").addEventListener("input", calc);
  for (const k of ["passport", "others"]) {
    $("#f_" + k).addEventListener("change", e => {
      const ok = [];
      for (const f of e.target.files) {
        if (f.size > MAX_FILE) { toast(`«${f.name}» أكبر من 4 ميجابايت.`, "error"); continue; }
        if (!/\.(jpe?g|png|pdf)$/i.test(f.name)) { toast(`«${f.name}» صيغة غير مسموحة. استخدم JPG أو PNG أو PDF.`, "error"); continue; }
        ok.push({ file: f, name: f.name });
      }
      if (ok.length) pending[k] = k === "passport" ? ok.slice(0, 1) : pending[k].concat(ok);
      e.target.value = ""; renderFiles();
    });
  }
  $("#clearBtn").onclick = () => { editingId = null; renderView(); };
  $("#recF").addEventListener("submit", async e => {
    e.preventDefault();
    const err = $("#f_err"); err.textContent = "";
    const val = k => $("#f_" + k).value.trim();
    const doc = {
      no: digits(val("no")), from: val("from"), phone: digits(val("phone")), passports: digits(val("passports")),
      date: val("date"), travelDate: val("travelDate"),
      names: $$("#namesBody input").map(i => i.value.trim()).filter(Boolean),
      price: digits(val("price")), extraPrice: digits(val("extraPrice")), net: digits(val("net")),
      extras: $("#f_extras").value.trim(), notes: $("#f_notes").value.trim(),
    };
    HOUSING.forEach(([k, , t]) => { doc[k] = t === "num" ? digits(val(k)) : val(k); });
    if (!doc.no) return err.textContent = "أدخل رقم الإيصال.";
    if (!doc.from) return err.textContent = "أدخل اسم من استُلمت منه المستندات.";
    if (Store.data.receipts.some(r => r.no === doc.no && r.id !== editingId)) return err.textContent = `رقم الإيصال ${doc.no} مستخدم من قبل.`;
    const btn = $("#saveBtn"); btn.disabled = true; btn.textContent = "جارٍ الحفظ…";
    try {
      const att = {};
      for (const k of ["passport", "others"]) {
        att[k] = [];
        for (const f of pending[k]) att[k].push(f.file ? await Store.upload(f.file) : f);
      }
      const old = editingId ? Store.data.receipts.find(x => x.id === editingId) : null;
      const id = editingId || uid("r_");
      const u = me();
      await Store.set("receipts", id, {
        ...doc, attachments: att,
        receiver: old ? old.receiver : u.name, receiverId: old ? old.receiverId : u.id,
        createdAt: old ? old.createdAt : new Date().toISOString(), updatedAt: new Date().toISOString(),
      });
      toast(old ? "تم حفظ التعديلات" : `تم حفظ الإيصال رقم ${doc.no}`);
      editingId = null; go("records"); showReceipt(id);
    } catch (x) {
      err.textContent = errMsg(x); btn.disabled = false; btn.textContent = editingId ? "حفظ التعديلات" : "حفظ الإيصال";
    }
  });
}

/* ---------- records ---------- */
function filtered() {
  const q = digits(search).trim().toLowerCase();
  const rs = receipts();
  if (!q) return rs;
  return rs.filter(r => [r.no, r.from, r.phone, r.receiver, r.travelDate, ...(r.names || [])].join(" ").toLowerCase().includes(q));
}
function recordsHead() {
  const rs = filtered();
  return `السجلات المدخلة (${rs.length}) — الإجمالي: ${fmt(rs.reduce((s, r) => s + num(r.net), 0))}`;
}
function recordRows() {

  return rs.map(r => {

async function exportExcel() {

/* ---------- modal ---------- */
function modal(html, wide) {
  closeModal();
  const ov = document.createElement("div"); ov.className = "ov"; ov.id = "ov"; ov.setAttribute("dir", "rtl");
  ov.innerHTML = `<div class="md ${wide ? "wide" : ""}" role="dialog" aria-modal="true">${html}</div>`;
  ov.addEventListener("click", e => { if (e.target === ov || e.target.closest("[data-close]")) closeModal(); });
  document.body.appendChild(ov); document.body.style.overflow = "hidden";
  return ov;
}
function closeModal() { $("#ov")?.remove(); document.body.style.overflow = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

function waNumber(p) {
  let d = digits(p).replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  else if (d.startsWith("0")) d = "218" + d.slice(1);
  else if (d.length === 9) d = "218" + d;
  return d;
}
function waText(r) {
  return [`السلام عليكم ${r.from || ""}`, `إيصال استلام مستندات سفر رقم ${r.no}`, r.travelDate ? `تاريخ السفر: ${r.travelDate}` : "",
    r.passports ? `عدد الجوازات: ${r.passports}` : "", r.net ? `الصافي: ${fmt(num(r.net))}` : "", "ميراث مكة للخدمات السياحية والحج والعمرة"].filter(Boolean).join("\n");
}
async function renderCanvas(r) {
  await loadScript("h2c");
  try { await document.fonts.ready; } catch {}
  const host = document.createElement("div"); host.className = "offscreen"; host.innerHTML = receiptHTML(r);
  document.body.appendChild(host);
  try { return await html2canvas(host.firstElementChild, { scale: 2, backgroundColor: "#ffffff", logging: false }); }
  finally { host.remove(); }
}
const canvasBlob = c => new Promise(res => c.toBlob(res, "image/png"));

function showReceipt(id) {
  const r = Store.data.receipts.find(x => x.id === id); if (!r) return;
  const wa = r.phone ? waNumber(r.phone) : "";
  const ov = modal(`<div class="md-h"><h3>الإيصال رقم ${esc(r.no)} — ${esc(r.from)}</h3><button class="btn-x" data-close aria-label="إغلاق">✕</button></div>
    <div class="md-acts">
      <button class="btn btn-primary" id="pdfBtn">⬇ تنزيل PDF للطباعة</button>
      <button class="btn btn-gold" id="imgBtn">⬇ حفظ كصورة</button>
      <button class="btn btn-ghost" id="copyBtn">نسخ الصورة</button>
      ${wa ? `<a class="btn btn-ghost" id="waBtn" href="https://wa.me/${wa}?text=${encodeURIComponent(waText(r))}" target="_blank" rel="noopener">فتح واتساب ${esc(r.phone)}</a>` : ""}
    </div>
    <ol class="wa-steps"><li>احفظ الإيصال كصورة أو انسخه.</li><li>${wa ? "اضغط «فتح واتساب» لتُفتح محادثة العميل برسالة جاهزة." : "أضف رقم هاتف للعميل ليظهر زر واتساب."}</li><li>أرفق الصورة في المحادثة (أو الصقها في واتساب ويب) ثم أرسل.</li></ol>
    <div id="imgOut"></div>
    <div class="paperwrap">${receiptHTML(r)}</div>`, true);
  const busy = (b, on) => { b.disabled = on; };
  $("#pdfBtn", ov).onclick = async e => {
    const b = e.currentTarget; busy(b, true);
    try {
      const c = await renderCanvas(r); await loadScript("pdf");
      const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4", orientation: "p" });
      const W = 210, H = 297, pagePx = Math.floor(c.width * H / W);
      if (c.height <= pagePx * 1.2) {
        // fits one page: shrink slightly if needed rather than split
        const h = Math.min(H, c.height * W / c.width), w = c.width * h / c.height;
        pdf.addImage(c.toDataURL("image/jpeg", .92), "JPEG", (W - w) / 2, 0, w, h);
      } else {
        for (let y = 0, first = true; y < c.height; y += pagePx, first = false) {
          const sh = Math.min(pagePx, c.height - y), part = document.createElement("canvas");
          part.width = c.width; part.height = sh;
          part.getContext("2d").drawImage(c, 0, y, c.width, sh, 0, 0, c.width, sh);
          if (!first) pdf.addPage();
          pdf.addImage(part.toDataURL("image/jpeg", .92), "JPEG", 0, 0, W, sh * W / c.width);
        }
      }
      await Store.save(`receipt-${r.no}.pdf`, pdf.output("blob"));
      toast("تم تنزيل ملف PDF. افتحه واطبعه من جهازك.");
    } catch (x) { toast(errMsg(x), "error"); }
    busy(b, false);
  };
  $("#imgBtn", ov).onclick = async e => {
    const b = e.currentTarget; busy(b, true);
    try {
      const blob = await canvasBlob(await renderCanvas(r));
      try { await Store.save(`receipt-${r.no}.png`, blob); toast("تم حفظ صورة الإيصال"); }
      catch (x) {
        if (x && x.code === "declined") throw x;
        $("#imgOut", ov).innerHTML = `<p style="margin:0 0 8px;color:var(--muted);font-size:13px">اضغط مطولاً على الصورة (أو بالزر الأيمن) واختر «حفظ الصورة».</p><img class="preview-img" alt="صورة الإيصال">`;
        $("#imgOut img", ov).src = URL.createObjectURL(blob);
      }
    } catch (x) { toast(errMsg(x), "error"); }
    busy(b, false);
  };
  $("#copyBtn", ov).onclick = e => {
    const b = e.currentTarget; busy(b, true);
    try {
      const p = renderCanvas(r).then(canvasBlob);
      navigator.clipboard.write([new ClipboardItem({ "image/png": p })])
        .then(() => toast("تم نسخ الصورة. الصقها في محادثة واتساب."))
        .catch(() => toast("المتصفح لم يسمح بالنسخ. استخدم «حفظ كصورة».", "error"))
        .finally(() => busy(b, false));
    } catch { toast("المتصفح لا يدعم نسخ الصور. استخدم «حفظ كصورة».", "error"); busy(b, false); }
  };
}

    const salt = uid("s");
    try {
      await Store.set("users", uid("u_"), { name, username: user, role: $("#nu_role").value, active: true, salt, hash: await sha(salt + ":" + p), createdAt: new Date().toISOString() });
      e.target.reset(); toast(`تمت إضافة ${name}`);
    } catch (x) { err.textContent = errMsg(x); }
  });
  $("#usersBody").addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    const id = b.dataset.pw || b.dataset.role || b.dataset.act || b.dataset.udel;
    const u = Store.data.users.find(x => x.id === id); if (!u) return;
    const { id: _, ...rest } = u;
    const admins = Store.data.users.filter(x => x.role === "admin" && x.active !== false);
    try {
      if (b.dataset.pw) {
        const ov = modal(`<div class="md-h"><h3>كلمة مرور جديدة لـ ${esc(u.name)}</h3><button class="btn-x" data-close aria-label="إغلاق">✕</button></div>
          <form id="pwF" class="grid"><label class="f">كلمة المرور الجديدة<input class="field" id="pw1" type="password" dir="ltr" autocomplete="new-password"></label>
          <div class="err" id="pw_err"></div><div class="md-acts"><button class="btn btn-primary" type="submit">حفظ</button><button type="button" class="btn btn-ghost" data-close>إلغاء</button></div></form>`);
        $("#pw1", ov).focus();
        $("#pwF", ov).addEventListener("submit", async ev => {
          ev.preventDefault(); const p = $("#pw1", ov).value;
          if (p.length < 4) return $("#pw_err", ov).textContent = "كلمة المرور 4 أحرف على الأقل.";
          const salt = uid("s");
          try { await Store.set("users", id, { ...rest, salt, hash: await sha(salt + ":" + p) }); closeModal(); toast("تم تغيير كلمة المرور"); }
          catch (x) { $("#pw_err", ov).textContent = errMsg(x); }
        });
      } else if (b.dataset.role) {
        if (u.role === "admin" && admins.length <= 1) return toast("يجب أن يبقى مدير واحد على الأقل.", "error");
        await Store.set("users", id, { ...rest, role: u.role === "admin" ? "staff" : "admin" });
      } else if (b.dataset.act) {
        if (u.active !== false && u.role === "admin" && admins.length <= 1) return toast("يجب أن يبقى مدير واحد على الأقل.", "error");
        await Store.set("users", id, { ...rest, active: u.active === false });
      } else if (b.dataset.udel) {
        if (u.role === "admin" && admins.length <= 1) return toast("يجب أن يبقى مدير واحد على الأقل.", "error");
        const ov = modal(`<div class="md-h"><h3>حذف المستخدم ${esc(u.name)}؟</h3></div>
          <p style="margin:0;color:var(--muted)">لن يتمكن من الدخول مجدداً. الإيصالات التي أدخلها تبقى كما هي.</p>
          <div class="md-acts"><button class="btn btn-primary" id="yesU" style="background:var(--danger)">حذف</button><button class="btn btn-ghost" data-close>إلغاء</button></div>`);
        $("#yesU", ov).onclick = async () => { try { await Store.remove("users", id); closeModal(); toast("تم حذف المستخدم"); } catch (x) { toast(errMsg(x), "error"); } };
      }
    } catch (x) { toast(errMsg(x), "error"); }
  });
}

Store.init();
</script>

</body>
</html>
