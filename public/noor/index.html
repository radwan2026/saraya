<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>منارة النور</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🌙%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="noor.css">
</head>
<body>
  <div id="stage">
    <canvas id="sky"></canvas>
    <div id="mosque"></div>
    <div id="minarets"></div>
    <canvas id="fx"></canvas>

    <!-- الرأس -->
    <header id="header">
      <div class="pill" id="roundPill"><span class="lbl">الجولة</span><b id="roundNo">1</b></div>
      <h1 class="title"><span class="orn">۞</span> منارة النور <span class="orn">۞</span></h1>
      <div class="pill timer" id="timerPill"><span class="lbl">الوقت</span><b id="timer">04:00</b></div>
    </header>

    <!-- شريط الآيات والأحاديث -->
    <div id="wisdom">
      <div class="wisdom-inner">
        <div class="wisdom-text" id="wisdomText"></div>
        <div class="wisdom-src" id="wisdomSrc"></div>
      </div>
    </div>

    <!-- المسبحة + أهل الكرم -->
    <section id="infoRow">
      <div id="tasbeeh">
        <svg viewBox="0 0 200 200" id="beads"></svg>
        <div class="tasbeeh-center"><b id="tasbeehNo">0</b><span>من ٣٣</span><small id="dhikrTotal">0 ذكر</small></div>
      </div>
      <div id="supporters">
        <div class="sup-title">✦ أهل الكرم ✦</div>
        <ol id="supList"></ol>
      </div>
    </section>

    <!-- الشخصية نوري -->
    <div id="nouri"><div class="bubble" id="nouriBubble">السلام عليكم! اكتب رقم فريقك ١ - ٤</div><div class="nouri-body" id="nouriBody"></div></div>

    <!-- بطاقات الفرق -->
    <section id="teams"></section>

    <!-- دليل الهدايا -->
    <section id="legend"></section>

    <!-- التعليمات -->
    <footer id="howto"><div id="howtoText"></div></footer>

    <!-- الطبقات العلوية -->
    <div id="dhikrLayer"></div>
    <div id="alerts"></div>
    <div id="toasts"></div>
    <div id="quiz" class="hidden"></div>
    <div id="victory" class="hidden"></div>
    <div id="pausedOverlay" class="hidden"><div>⏸ استراحة قصيرة... نعود بإذن الله</div></div>
  </div>

  <button id="soundBtn" class="hidden">🔊 اضغط لتفعيل الصوت</button>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="noor.js"></script>
</body>
</html>
