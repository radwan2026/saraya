<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>واحة النور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="scene"></canvas>

    <!-- ===== الترويسة: العنوان والهدف ===== -->
    <header id="top">
      <div class="brand">
        <span class="brand-icon" data-icon="moon"></span>
        <div>
          <h1>واحة النور</h1>
          <p id="subtitle">أنيروا المسجد بتفاعلكم الليلة</p>
        </div>
        <div class="level-chip"><small>الليلة</small><b id="level">1</b></div>
      </div>
      <div class="goal">
        <div class="goal-bar"><div id="goalFill"></div><div class="goal-shine"></div></div>
        <div class="goal-text"><span id="goalText">0 / 1500 نور</span><b id="goalPct">0%</b></div>
      </div>
      <div class="chips">
        <div class="chip tasbih"><span data-icon="tasbih"></span><span>المسبحة</span><b id="dhikrCount">0</b></div>
        <div class="chip musk hidden" id="muskChip"><span data-icon="perfume"></span><span>نفحات المسك ×2</span><b id="muskTime">0</b></div>
        <div class="chip star-night hidden" id="starNight"><span data-icon="crown"></span><img alt=""><span class="name"></span></div>
      </div>
    </header>

    <!-- ===== تحدي التسبيح ===== -->
    <div id="challenge" class="hidden">
      <div class="ch-title">تحدّي التسبيح الجماعي</div>
      <div class="ch-bar"><div id="chFill"></div></div>
      <div class="ch-text"><b id="chCount">0</b> / <span id="chTarget">0</span> · <span id="chTime">0</span>ث</div>
    </div>

    <!-- ===== البطاقة الرئيسية: سؤال / آية / لوحة الشرف ===== -->
    <section id="card" class="card">
      <div id="cardInner"></div>
    </section>

    <div id="toasts"></div>
    <div id="dhikrLayer"></div>
    <div id="banner" class="hidden"></div>

    <!-- ===== نوري: فانوس الواحة ===== -->
    <div id="noori">
      <div id="bubble"><span id="bubbleText">السلام عليكم ورحمة الله 🌙</span></div>
      <svg class="noori-svg" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="nGlass" cx="50%" cy="55%" r="60%">
            <stop offset="0" stop-color="#fff7d6"/>
            <stop offset=".45" stop-color="#ffd27a"/>
            <stop offset="1" stop-color="#e08a1e"/>
          </radialGradient>
          <linearGradient id="nMetal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe7a3"/>
            <stop offset="1" stop-color="#b07a22"/>
          </linearGradient>
          <radialGradient id="nAura" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="rgba(255,210,122,.55)"/>
            <stop offset="1" stop-color="rgba(255,210,122,0)"/>
          </radialGradient>
        </defs>
        <circle cx="100" cy="150" r="100" fill="url(#nAura)" class="aura"/>
        <circle cx="100" cy="16" r="10" fill="none" stroke="url(#nMetal)" stroke-width="5"/>
        <path d="M60 58 Q100 14 140 58 Z" fill="url(#nMetal)"/>
        <rect x="52" y="56" width="96" height="14" rx="5" fill="url(#nMetal)"/>
        <path d="M56 70 C30 120 34 180 64 214 H136 C166 180 170 120 144 70 Z" fill="url(#nGlass)" stroke="#b07a22" stroke-width="4"/>
        <path d="M100 74 C92 100 86 120 86 150 M100 74 C108 100 114 120 114 150" stroke="#c98a2b" stroke-width="2" fill="none" opacity=".45"/>
        <g class="flame"><path d="M100 168 C88 156 92 140 100 128 C108 140 112 156 100 168 Z" fill="#fff" opacity=".85"/></g>
        <g class="eyes">
          <ellipse cx="80" cy="118" rx="11" ry="14" fill="#2b1606"/>
          <ellipse cx="120" cy="118" rx="11" ry="14" fill="#2b1606"/>
          <circle cx="84" cy="112" r="4" fill="#fff"/>
          <circle cx="124" cy="112" r="4" fill="#fff"/>
        </g>
        <ellipse cx="66" cy="140" rx="9" ry="5" fill="#ff8a65" opacity=".55"/>
        <ellipse cx="134" cy="140" rx="9" ry="5" fill="#ff8a65" opacity=".55"/>
        <path d="M88 142 Q100 154 112 142" stroke="#2b1606" stroke-width="4" fill="none" stroke-linecap="round"/>
        <rect x="58" y="212" width="84" height="14" rx="5" fill="url(#nMetal)"/>
        <path d="M84 226 L100 250 L116 226 Z" fill="url(#nMetal)"/>
      </svg>
    </div>

    <footer id="ticker"><div class="track" id="tickerTrack"></div></footer>
    <button id="soundHint" class="hidden">🔊 اضغط لتفعيل الصوت</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
